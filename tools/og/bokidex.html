<!doctype html><html><head><meta charset="utf-8"><title>Bokidex share image</title>
<!-- The Bokidex link preview (assets/img/og-bokidex.jpg, 1200x630). Re-render: node tools/og/render.js /tmp/og-bokidex.png bokidex.html (site served on :8765), then save as JPEG. -->
<style>
@font-face { font-family: "Lilita"; src: url("../../assets/fonts/LilitaOne.woff2") format("woff2"); }
html,body{margin:0;background:#070b16}
.og{position:relative;width:1200px;height:630px;overflow:hidden;font-family:"Lilita";
  background:radial-gradient(ellipse 55% 75% at 76% 58%, #232a55 0%, transparent 70%), radial-gradient(ellipse 45% 60% at 8% 0%, #1c1336 0%, transparent 70%), #070b16}
/* a soft pool of light the group stands in */
.glow{position:absolute;inset:0;background:
  radial-gradient(ellipse 34% 30% at 76% 66%, rgba(195,107,255,.30), transparent 70%),
  radial-gradient(ellipse 26% 22% at 66% 80%, rgba(79,216,203,.22), transparent 70%),
  radial-gradient(ellipse 22% 18% at 90% 30%, rgba(255,160,90,.14), transparent 70%)}
.floor{position:absolute;left:520px;right:-60px;top:520px;height:150px;border-radius:50%;background:radial-gradient(ellipse at center, rgba(170,140,255,.28), rgba(79,216,203,.08) 50%, transparent 72%);filter:blur(8px)}
.em i{position:absolute;border-radius:50%;width:var(--s);height:var(--s);background:rgb(var(--c));box-shadow:0 0 calc(var(--s)*2.4) calc(var(--s)*.5) rgba(var(--c),.6)}
.b{position:absolute;filter:drop-shadow(0 18px 22px rgba(0,0,0,.6))}
.b img{display:block;width:100%;height:auto}
.back{filter:drop-shadow(0 14px 18px rgba(0,0,0,.6)) brightness(.78) saturate(.9)}
.sky{filter:drop-shadow(0 24px 30px rgba(0,0,0,.55)) brightness(.9)}
.fade{position:absolute;left:0;top:0;bottom:0;width:640px;background:linear-gradient(90deg,#070b16 38%,rgba(7,11,22,.75) 62%,transparent);z-index:8}
.left{position:absolute;left:66px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;z-index:9}
.word{margin:0 0 0 -10px;filter:drop-shadow(0 14px 30px rgba(0,0,0,.6))}
.word img{width:540px;height:auto;display:block}
.sub{margin-top:18px;font-size:76px;line-height:1;letter-spacing:.5px;
  color:#fff;filter:drop-shadow(0 6px 20px rgba(0,0,0,.5))}
.url{margin-top:22px;font-family:"Lilita";font-size:24px;letter-spacing:1px;color:rgba(220,226,245,.55)}
</style></head><body>
<div class="og" id="og">
  <div class="glow"></div>
  <div class="em" id="em"></div>
  <!-- sky -->
  <div class="b sky" style="left:930px;top:-6px;width:250px;z-index:2;transform:rotate(-6deg)"><img src="../../assets/img/boki-front/dragonkite-960.webp"></div>
  <div class="b sky" style="left:610px;top:22px;width:200px;z-index:2;transform:rotate(4deg)"><img src="../../assets/img/boki-front/zephyrak-960.webp"></div>
  <!-- back row -->
  <div class="floor"></div>
  <div class="b back" style="left:705px;top:172px;width:300px;z-index:3"><img src="../../assets/img/boki-front/eclipsowl-960.webp"></div>
  <div class="b back" style="left:962px;top:222px;width:250px;z-index:3"><img src="../../assets/img/boki-front/pyrraven-960.webp"></div>
  <!-- front row -->
  <div class="b" style="left:632px;top:372px;width:215px;z-index:5"><img src="../../assets/img/boki-front/nettlynx-960.webp"></div>
  <div class="b" style="left:812px;top:352px;width:245px;z-index:6"><img src="../../assets/img/boki-front/bubblisk-960.webp"></div>
  <div class="b" style="left:1012px;top:405px;width:200px;z-index:5"><img src="../../assets/img/boki-front/glomwort-960.webp"></div>
  <div class="fade"></div>
  <div class="left">
    <h1 class="word" aria-label="Bokidex"><img src="../../assets/img/wordmark-bokidex-2400.webp"></h1>
    <div class="sub">Meet the Boki.</div>
    <div class="url">projectboki.com/bokidex</div>
  </div>
</div>
<script>
let s=11;const r=()=>((s=s*16807%2147483647)/2147483647);const em=document.getElementById('em');
const cs=['120,230,220','200,130,255','255,190,120'];
for(let i=0;i<46;i++){const e=document.createElement('i');e.style.cssText=`left:${(42+r()*58).toFixed(1)}%;top:${(r()*100).toFixed(1)}%;--s:${(1.5+r()*3.5).toFixed(1)}px;--c:${cs[i%3]};opacity:${(.3+r()*.6).toFixed(2)}`;em.appendChild(e)}
</script></body></html>
