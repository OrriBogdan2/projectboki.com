<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Project Boki · Control Room</title>
<style>
/* ================================================================== design tokens
   One calm system: warm neutrals, one accent, three verdict colours (good / watch / bad).
   Spacing 4-8-12-16-24-32, type 11.5-12.5-14-16-20-28, radius 8/12. Numbers are tabular everywhere. */
:root{
  --bg:#f6f5f1;--surface:#fff;--surface2:#f1f0ec;--ink:#1b1b19;--ink2:#56544e;--muted:#8b8880;--line:#e7e5de;--line2:#cfccc2;
  --accent:#2f6fd0;--accent-ink:#fff;--focus:#2f6fd0;
  --good:#1f8f4e;--warn:#b97a00;--serious:#d0632b;--crit:#c9382f;
  --c-cory:#2f6fd0;--c-gc:#e2703f;--c-orrib:#1fa67a;--c-coord:#6a5ad6;--c-yellow:#d99a00;--c-magenta:#de7aa2;--c-red:#d94a47;
  --shadow:0 1px 2px rgba(20,20,10,.05),0 10px 28px rgba(20,20,10,.08);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --t-xs:11.5px;--t-sm:12.5px;--t-md:14px;--t-lg:16px;--t-xl:20px;--t-kpi:28px;
  --r:12px;--r-sm:8px;--nav:216px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme=dark]{
  --bg:#111110;--surface:#1a1a18;--surface2:#242422;--ink:#edece8;--ink2:#bbb9b0;--muted:#86847c;--line:#2c2c29;--line2:#3d3d39;
  --accent:#5b9cf0;--accent-ink:#0d1420;--focus:#5b9cf0;
  --good:#43b974;--warn:#e0a82e;--serious:#e8834f;--crit:#ef6a61;
  --c-cory:#5b9cf0;--c-gc:#e2703f;--c-orrib:#2fb587;--c-coord:#9388ee;--c-yellow:#d9a019;--c-magenta:#dd6c97;--c-red:#ea6a68;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#111110;--surface:#1a1a18;--surface2:#242422;--ink:#edece8;--ink2:#bbb9b0;--muted:#86847c;--line:#2c2c29;--line2:#3d3d39;
  --accent:#5b9cf0;--accent-ink:#0d1420;--focus:#5b9cf0;
  --good:#43b974;--warn:#e0a82e;--serious:#e8834f;--crit:#ef6a61;
  --c-cory:#5b9cf0;--c-gc:#e2703f;--c-orrib:#2fb587;--c-coord:#9388ee;--c-yellow:#d9a019;--c-magenta:#dd6c97;--c-red:#ea6a68;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
}}

/* ================================================================== base */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:var(--t-md)/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-sm);padding:6px 12px;font-weight:500}
button:hover{background:var(--surface2)}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--crit);border-color:var(--crit)}
button.icon{padding:0;width:34px;height:34px;display:inline-grid;place-items:center;border-color:var(--line)}
button.link{border:0;background:none;padding:0;color:var(--accent);font-weight:500}button.link:hover{text-decoration:underline;background:none}
input[type=text],input[type=search],input[type=number],textarea,select{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-sm);padding:7px 10px;width:100%}
textarea{min-height:120px;resize:vertical;font-family:var(--mono);font-size:var(--t-sm)}
svg{display:block}
.hide{display:none!important}
.mono{font-family:var(--mono);font-size:var(--t-sm)}
.muted{color:var(--muted)}.ink2{color:var(--ink2)}.small{font-size:var(--t-sm)}.num{font-variant-numeric:tabular-nums}
.right{text-align:right}.nowrap{white-space:nowrap}.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:var(--s2);align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}h1{font-size:var(--t-xl)}h2{font-size:var(--t-lg)}
h3{font-size:var(--t-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:650}
.ulane{margin-top:4px;line-height:1.35}.ureset{margin-top:10px}.ucount{font-weight:650;font-size:14px;letter-spacing:.02em}.ukv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:13px}.ukv dt{color:var(--muted)}.ukv dd{margin:0;min-width:0}.uj-done{color:var(--good)}.uj-failed{color:var(--crit)}.uj-blocked{color:var(--serious)}

/* verdict colours: v-good / v-watch / v-bad set --v; cards get a left rule, numbers and pills take the colour */
.v-good{--v:var(--good)}.v-watch{--v:var(--warn)}.v-bad{--v:var(--crit)}.v-none{--v:var(--line2)}
.card.v-good,.card.v-watch,.card.v-bad{box-shadow:inset 3px 0 0 var(--v)}
.kpi.v-good,.kpi.v-watch,.kpi.v-bad,.vc{color:var(--v)}
.vd{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:var(--t-xs);font-weight:650;line-height:18px;white-space:nowrap;color:var(--v);background:color-mix(in srgb,var(--v) 13%,transparent)}
.vd.v-none{color:var(--muted);background:var(--surface2)}
.verdict{margin-top:6px;font-size:var(--t-sm);color:var(--ink2);line-height:1.55}.verdict .vd{margin-right:6px}

/* ================================================================== sign-in */
#signin{min-height:100dvh;display:grid;place-items:center;padding:24px}
.card-signin{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:var(--shadow);text-align:center}
.wordmark{font-size:22px;font-weight:700;letter-spacing:-.02em}
.wordmark small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
#gsi{display:flex;justify-content:center;min-height:44px;margin:26px 0 12px}
.err{color:var(--crit);font-size:13px;min-height:18px;margin-top:8px}

/* ================================================================== app shell */
#app{display:grid;grid-template-columns:var(--nav) 1fr;min-height:100dvh}
nav.side{position:sticky;top:0;height:100dvh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:18px 10px 10px;display:flex;flex-direction:column;gap:1px}
nav.side .wordmark{font-size:16px;padding:2px 10px 10px}
.navgroup{font-size:10.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.navitem{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--ink2);font-weight:500}
.navitem:hover{background:var(--surface2);text-decoration:none;color:var(--ink)}
.navitem.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--ink);font-weight:650}.navitem.on svg{stroke:var(--accent)}
.navitem svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.navitem .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.navitem .cnt.hot{color:#fff;background:var(--crit);border-radius:999px;padding:0 6px;line-height:17px;font-weight:650}
nav.side .foot{margin-top:auto;padding:14px 10px 4px;font-size:11.5px;color:var(--muted)}
main{min-width:0;padding:0 28px 56px;max-width:1500px}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:var(--s5)}
.topbar .stamp{font-size:12px;color:var(--muted);white-space:nowrap}
.topbar .stamp.stale{color:var(--crit)}
.user{font-size:var(--t-sm);color:var(--ink2);margin-left:4px}
nav.bottom{display:none}
.sheet{position:fixed;inset:auto 0 0 0;max-height:88dvh;overflow-y:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:6px 14px calc(14px + env(safe-area-inset-bottom));z-index:30;box-shadow:var(--shadow)}
.sheet .navgroup{padding:12px 2px 6px}
.sheet .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet .navitem{flex-direction:column;gap:5px;font-size:12px;padding:10px 6px;border:1px solid var(--line)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}

/* ================================================================== cards, tiles, sections
   Card anatomy, top to bottom: h3 label, .kpi headline number, .verdict (pill + one line), .sub detail. */
.grid{display:grid;gap:var(--s3)}
.tiles{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.cols2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.cols3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);min-width:0}
.card.click,a.card{cursor:pointer;transition:border-color .12s;color:inherit;display:block}.card.click:hover,a.card:hover{border-color:var(--line2);text-decoration:none}
.card h3{margin-bottom:var(--s2)}
.kpi{font-size:var(--t-kpi);font-weight:650;letter-spacing:-.02em;line-height:1.1}
.kpi small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:5px}
.sub{font-size:var(--t-sm);color:var(--ink2);margin-top:6px}
.note{font-size:var(--t-sm);color:var(--muted);line-height:1.5}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:var(--s6) 0 var(--s3)}
.section-h:first-child{margin-top:0}.section-h .small{color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.good{background:var(--good)}.dot.warning{background:var(--warn)}.dot.serious{background:var(--serious)}.dot.critical{background:var(--crit)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:var(--t-xs);font-weight:650;background:var(--surface2);color:var(--ink2);white-space:nowrap;line-height:18px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.s-done,.badge.s-online{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.badge.s-running{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.badge.s-partial,.badge.s-warning{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.badge.s-failed,.badge.s-blocked,.badge.s-critical,.badge.s-offline{color:var(--crit);background:color-mix(in srgb,var(--crit) 12%,transparent)}
.badge.s-serious{color:var(--serious);background:color-mix(in srgb,var(--serious) 12%,transparent)}
.badge.s-skipped,.badge.s-other,.badge.s-redo{color:var(--muted)}
.badge.plain::before{display:none}
.acct{display:inline-flex;align-items:center;gap:6px;font-weight:500}.acct i{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.notconn{display:inline-flex;align-items:center;gap:6px;color:var(--serious);font-size:12px}
.meter{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;border-radius:3px}
.list{display:flex;flex-direction:column}.list>div{padding:9px 0;border-top:1px solid var(--line)}.list>div:first-child{border-top:0;padding-top:0}.list>div:last-child{padding-bottom:0}
.list .t{font-size:var(--t-xs);color:var(--muted);white-space:nowrap}
.feed>div{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:baseline;cursor:pointer}.feed>div:hover .ell{text-decoration:underline}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
pre{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;overflow:auto;font-size:12px;line-height:1.5;max-height:60vh;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0}
.md p{margin:6px 0}.md ul{margin:4px 0;padding-left:18px}.md code{background:var(--surface2);padding:0 4px;border-radius:4px;font-size:12px}.md h4{margin:10px 0 2px;font-size:13px}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chip .n{opacity:.6;margin-left:4px}
.toolbar{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin:0 0 var(--s3)}.toolbar input[type=search]{max-width:260px;flex:1 1 160px}
.toolbar .cnt{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.fpanel{flex:1 1 100%;display:grid;grid-template-columns:max-content 1fr;gap:8px 12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.fpanel .fl{font-size:12px;color:var(--muted);padding-top:4px}
.more{display:block;width:100%;margin-top:var(--s2);padding:9px;border:1px dashed var(--line2);background:none;color:var(--ink2);border-radius:var(--r);font-size:var(--t-sm)}.more:hover{background:var(--surface2)}

/* needs-you panel (Home, Alerts): the first thing the owner reads */
.hero{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:var(--s4) var(--s4) var(--s3);box-shadow:inset 3px 0 0 var(--v,var(--line2))}
.hero .hh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:var(--s2)}.hero .hh b{font-size:var(--t-lg);letter-spacing:-.01em}
.todo{counter-reset:todo;margin:0;padding:0;list-style:none}
.todo li{counter-increment:todo;position:relative;padding:9px 0 9px 32px;border-top:1px solid var(--line);line-height:1.45}.todo li:first-child{border-top:0}
.todo li::before{content:counter(todo);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;background:color-mix(in srgb,var(--v,var(--muted)) 15%,transparent);color:var(--v,var(--muted));font-size:11.5px;font-weight:700;display:grid;place-items:center}

/* fold: everything that is detail or debug sits behind one of these; open state is remembered across refreshes */
details.fold{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:var(--s3);min-width:0}
details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
details.fold>summary{display:flex;align-items:center;gap:10px;padding:12px var(--s4);font-weight:600}
details.fold>summary::before,.pn-card>summary::before{content:'';width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .12s;flex:none;margin:0 3px 0 1px}
details.fold[open]>summary::before,.pn-card[open]>summary::before{transform:rotate(45deg)}
details.fold>summary .hint{margin-left:auto;font-weight:400;color:var(--muted);font-size:var(--t-sm);text-align:right}
details.fold>.fb{padding:0 var(--s4) var(--s4);min-width:0}
details.fold.plain{border:0;background:none;margin-top:var(--s2)}details.fold.plain>summary{padding:4px 0;font-weight:500;font-size:var(--t-sm);color:var(--ink2);gap:6px}details.fold.plain>.fb{padding:6px 0 0}
details.fold .tw{border:0;border-radius:0;margin:0 calc(-1 * var(--s4)) calc(-1 * var(--s4));border-top:1px solid var(--line)}
details.fold .toolbar{margin-top:2px}

/* compact server grid */
.srv{display:grid;gap:var(--s2);grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.srv>*{color:inherit;display:block;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;background:var(--surface);min-width:0}
.srv b{display:flex;align-items:center;gap:6px;font-size:13px}.srv b span.ell{min-width:0}.srv small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}

/* patch notes */
.pn-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.pn-bar input[type=search]{flex:1 1 220px;min-width:0}
.pn-jump{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}.pn-jump button.chip{flex:0 0 auto;font-size:13px;cursor:pointer;font-family:inherit}
.pn-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:8px;scroll-margin-top:70px;min-width:0}
.pn-card>summary{padding:12px 14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.pn-card>summary::before{align-self:center}
.pn-v{font-weight:650;font-size:16px}.pn-d{font-size:13px;color:var(--muted);white-space:nowrap}.pn-n{font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap}
.pn-h{flex:1 1 100%;font-size:14px;color:var(--ink2);padding-left:24px;margin-top:-2px}
.pn-body{padding:0 14px 12px 14px}.pn-sec{border-left:3px solid var(--line);padding-left:10px;margin:10px 0 0}.pn-sec h4{margin:0 0 2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pn-sec ul{margin:0;padding-left:18px}.pn-sec li{margin:3px 0;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.pn-sec.s-new{border-left-color:var(--good)}.pn-sec.s-fix{border-left-color:var(--crit)}.pn-sec.s-perf{border-left-color:var(--serious)}.pn-sec.s-art{border-left-color:var(--accent)}
.pn-card mark{background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 2px}

/* ================================================================== tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--ink)}th.on{color:var(--ink)}th .arr{opacity:.7;margin-left:3px;font-size:10px}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;max-width:420px}
tbody tr:last-child td{border-bottom:0}tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--surface2)}
td .ell{max-width:420px}td .cell{display:contents}
table.plain th{cursor:default}

/* ================================================================== drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:40;box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .18s ease,visibility 0s .18s}
.drawer.open{transform:none;visibility:visible;transition:transform .18s ease}
.drawer .dh{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.drawer .dh h2{font-size:15px;line-height:1.3;overflow-wrap:anywhere}.drawer .db{padding:14px 18px 32px;overflow:auto;flex:1}
.drawer .db .kv{margin-bottom:12px}

/* ================================================================== charts */
.chart{position:relative;width:100%}
.chart svg{width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .grid line{stroke:var(--line);stroke-width:1}.chart .axis{stroke:var(--line2)}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .hit{fill:transparent}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:7px;max-width:280px;box-shadow:var(--shadow);opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:6px 0 2px}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
.spark{width:100%;height:28px}

function dot(level){ return `<span class="dot ${esc(level)}"></span>`; }
function notconn(src, what){ return `<span class="notconn" title="${esc(src && src.err || '')}">● ${esc(what||'not connected')}${src && src.err ? ': '+esc(src.err.slice(0,80)) : ''}</span>`; }
function srcLine(sources){ if(!sources) return ''; const bad = Object.entries(sources).filter(([k,v])=>!v.ok); return bad.length ? `<div class="small" style="margin-bottom:10px">${bad.map(([k,v])=>notconn(v,k)).join(' &nbsp; ')}</div>` : ''; }
function mdLite(s){ // tiny markdown: headings, bullets, bold, code, paragraphs. Output is escaped first.
  const lines = esc(s||'').split('\n'); let out='', inList=false, inPre=false;
  for (let l of lines){
    if (l.startsWith('```')){ if(inPre){out+='</pre>';inPre=false;} else {out+='<pre>';inPre=true;} continue; }
    if (inPre){ out+=l+'\n'; continue; }
    l = l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
    const li = l.match(/^\s*(?:[-*]|\d+[.)])\s+(.*)/);
    if (li){ if(!inList){out+='<ul>';inList=true;} out+=`<li>${li[1]}</li>`; continue; }
    if (inList){ out+='</ul>'; inList=false; }
    if (/^#{1,6}\s/.test(l)) out+=`<h4>${l.replace(/^#+\s/,'')}</h4>`; else if (l.trim()) out+=`<p>${l}</p>`;
  }
  if(inList) out+='</ul>'; if(inPre) out+='</pre>'; return `<div class="md">${out}</div>`;
}

// ---- shared building blocks (one card anatomy for every section)
// verdict: 'good' | 'watch' | 'bad' | '' ; accepts the server's level words too
const VWORD = {good:'Good', watch:'Watch', bad:'Problem'};
function vOf(x){ return ({good:'good',ok:'good',watch:'watch',warning:'watch',warn:'watch',serious:'bad',critical:'bad',bad:'bad',crit:'bad'})[x] || ''; }
function vd(v, text){ v = vOf(v); return `<span class="vd v-${v||'none'}">${esc(text || VWORD[v] || '—')}</span>`; }
// tile: label, big number, optional unit, verdict pill + one plain line, optional detail (html)
function stat({label, value, unit, v, word, line, sub, href, cls, extra}){
  v = vOf(v); const tag = href ? 'a' : 'div';
  return `<${tag} class="card ${v?'v-'+v:''} ${cls||''}"${href?` href="${esc(href)}"`:''}><h3>${esc(label)}</h3><div class="kpi ${v?'v-'+v:''}">${value}${unit?`<small>${esc(unit)}</small>`:''}</div>${
    (v || line) ? `<div class="verdict">${v?vd(v, word):''}<span>${line||''}</span></div>` : ''}${extra||''}${sub?`<div class="sub">${sub}</div>`:''}</${tag}>`;
}
// fold: a closed-by-default expander for detail; open/closed is remembered so the 60 s refresh never shuts it
const FOLD = {};
function fold(key, title, hint, body, o={}){
  const open = key in FOLD ? FOLD[key] : !!o.open;
  return `<details class="fold ${o.plain?'plain':''}" data-fk="${esc(key)}"${open?' open':''}><summary><span>${title}</span>${hint?`<span class="hint">${hint}</span>`:''}</summary><div class="fb"${o.id?` id="${o.id}"`:''}>${body||''}</div></details>`;
}
document.addEventListener('toggle', e => { const d = e.target; if (!d.dataset || !d.dataset.fk) return; const was = FOLD[d.dataset.fk]; FOLD[d.dataset.fk] = d.open;
  if (d.open && was !== true && d.querySelector('[data-lazy]')) rerender(); }, true);   // charts need a visible box to size themselves
// "show N more" for plain lists: items past `n` are hidden until asked for
function capped(key, items, n, wrap){
  const all = FOLD['more:'+key], shown = all ? items : items.slice(0, n);
  return wrap(shown.join('')) + (items.length > n ? `<button class="more" data-more="${esc(key)}">${all ? 'Show fewer' : `Show ${items.length - n} more`}</button>` : '');
}
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-more]'); if (!b) return; FOLD['more:'+b.dataset.more] = !FOLD['more:'+b.dataset.more]; rerender(); });

async function api(path, opts={}){
  const h = {'Accept':'application/json', ...(opts.headers||{})};
  if (token) h.Authorization = 'Bearer ' + token;
  if (opts.body) h['Content-Type'] = 'application/json';
  const r = await fetch(API + path, {method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined});
  let j = null; try { j = await r.json(); } catch(e) {}
  if (r.status === 401 && token) { signout(false); throw new Error('signed out'); }
  if (!r.ok) throw Object.assign(new Error((j && j.error) || ('HTTP ' + r.status)), {status: r.status, body: j});
  return j;
}

// ------------------------------------------------------------------ sign-in
async function boot(){
  if (token) {
    try { me = (await api('/me')).user; } catch(e) { me = null; }
  }
  if (!me) return showSignin();
  if (!['owner','admin'].includes(me.role)) { token=null; try{localStorage.removeItem(TOKEN_KEY);}catch(e){} return showSignin('This account is not an admin.'); }
  showApp();
}
async function showSignin(err){
  $('#app').classList.add('hide'); $('#signin').classList.remove('hide'); $('#signin-err').textContent = err || '';
  let cfg = null; try { cfg = await api('/config'); } catch(e) { $('#gsi-msg').textContent = 'API not reachable'; }
  if (cfg && cfg.google_client_id) {
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => { google.accounts.id.initialize({client_id: cfg.google_client_id, callback: onGoogle, ux_mode:'popup'});
      google.accounts.id.renderButton($('#gsi'), {theme: (st.theme||'')==='dark' || (!st.theme && matchMedia('(prefers-color-scheme: dark)').matches) ? 'filled_black':'outline', size:'large', width: 300, text:'signin_with', shape:'pill'}); };
    s.onerror = () => { $('#gsi-msg').textContent = 'Google sign-in did not load.'; };
    document.head.appendChild(s);
  } else if (cfg) { $('#gsi-msg').textContent = 'Google sign-in is not configured on this server.'; }
}
async function onGoogle(resp){
  try { const r = await api('/signin/google', {method:'POST', body:{credential: resp.credential}}); setToken(r.token); me = r.user; if(!['owner','admin'].includes(me.role)) return showSignin('Signed in, but this Google account is not an admin.'); showApp(); }
  catch(e) { $('#signin-err').textContent = e.message; }
}
function setToken(t){ token = t; try{ localStorage.setItem(TOKEN_KEY, t); }catch(e){} }
async function signout(call=true){ if (call) { try { await api('/signout', {method:'POST'}); } catch(e){} } token=null; me=null; try{localStorage.removeItem(TOKEN_KEY);}catch(e){} clearInterval(timer); closeDrawer(); showSignin(); }
$('#signout').onclick = () => signout(true);

// ------------------------------------------------------------------ app shell & routing
function icon(d){ return `<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`; }
function showApp(){
  $('#signin').classList.add('hide'); $('#app').classList.remove('hide');
  $('#who').textContent = me.display || me.role;
  $('#sidenav').innerHTML = `<div class="wordmark">Project Boki<small>Control Room</small></div>` +
    GROUPS.map(([g,gl]) => `<div class="navgroup">${gl}</div>` + SECTIONS.filter(x => x[3] === g).map(([k,l,d]) => `<a class="navitem" data-s="${k}" href="#${k}">${icon(d)}<span>${l}</span><span class="cnt" id="cnt-${k}"></span></a>`).join('')).join('') +
    `<div class="foot">Times in ET · refreshes every 60 s</div>`;
  $('#bottomnav').innerHTML = PRIMARY_MOBILE.map(k => { const s = SECTIONS.find(x=>x[0]===k); return `<a class="navitem" data-s="${k}" href="#${k}">${icon(s[2])}<span>${s[1]}</span></a>`; }).join('') +
    `<a class="navitem" id="more" href="#more">${icon('M5 12h.01M12 12h.01M19 12h.01')}<span>More</span></a>`;
  $('#more').onclick = ev => { ev.preventDefault(); openSheet(); };
  const h = location.hash.replace('#','').split('/')[0];
  if (h === 'signout') { history.replaceState(null,'',location.pathname+location.search+'#home'); return signout(false); }
  go(ENDPOINT[h] ? h : (st.section && ENDPOINT[st.section] ? st.section : 'home'), true);
  clearInterval(timer); timer = setInterval(() => load(cur, true), 60000);
  addEventListener('hashchange', () => { const s = location.hash.replace('#','').split('/')[0]; if (s && s !== cur && ENDPOINT[s]) go(s, true); });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(rerender, 150); });
}
function openSheet(){
  const scrim = document.createElement('div'); scrim.className='scrim'; const sheet = document.createElement('div'); sheet.className='sheet';
  sheet.innerHTML = GROUPS.map(([g,gl]) => `<div class="navgroup">${gl}</div><div class="grid">${SECTIONS.filter(x => x[3] === g).map(([k,l,d]) => `<a class="navitem ${k===cur?'on':''}" href="#${k}">${icon(d)}<span>${l}</span></a>`).join('')}</div>`).join('') + `
    <div class="row" style="margin-top:12px;justify-content:space-between"><span class="small muted">${esc(me.display||me.role)}</span><button class="small" id="sheet-out">Sign out</button></div>`;
  const close = () => { scrim.remove(); sheet.remove(); }; scrim.onclick = close; sheet.onclick = e => { if (e.target.closest('a')) close(); };
  $('#sheet-out', sheet).onclick = () => { close(); signout(true); };
  document.body.append(scrim, sheet);
}
function go(sec, fromHash){
  cur = sec; st.section = sec; saveState(); closeDrawer();
  if (!fromHash || location.hash.replace('#','').split('/')[0] !== sec) history.replaceState(null,'',location.pathname+location.search+'#'+sec);
  document.querySelectorAll('.navitem').forEach(a => a.classList.toggle('on', a.dataset.s === sec));
  $('#title').textContent = SECTIONS.find(x=>x[0]===sec)[1];
  if (data[sec]) render(); else $('#view').innerHTML = '<div class="empty">Loading…</div>';
  load(sec);
  const id = location.hash.split('/')[1]; if (id && sec === 'agents') openAgent(id);
}
$('#refresh').onclick = () => load(cur, false, true);
async function load(sec, quiet, force){
  if (!force && quiet && document.hidden) return;
  if (!force && quiet && sec === 'hunters' && loadedAt[sec] && now() - loadedAt[sec] < 290) return;   // hunters.json is rebuilt every 15 min; poll it every 5
  const stamp = $('#stamp'); if (!quiet) stamp.textContent = 'updating…';
  try {
    data[sec] = await api('/admin/' + ENDPOINT[sec]); loadedAt[sec] = now();
    if (sec === cur) render();
    if (sec === 'home') sideCounts(data.home);
  } catch(e) {
    if (!data[sec] && sec === cur) $('#view').innerHTML = `<div class="empty">Could not load: ${esc(e.message)}</div>`;
    stamp.textContent = 'update failed · ' + esc(e.message); stamp.classList.add('stale'); return;
  }
  stamp.classList.remove('stale'); stamp.textContent = 'updated ' + fmtT.format(new Date()) + ' ET';
}
function sideCounts(o){ if(!o) return; const set=(k,v,hot)=>{ const el=$('#cnt-'+k); if(el){ el.textContent=v??''; el.classList.toggle('hot',!!hot);} };
  set('agents', o.running && o.running.count); set('alerts', o.health && o.health.alerts, o.health && o.health.level!=='good'); set('backlog', o.backlog); }
function rerender(){ if (data[cur]) render(); if (drawerRender) drawerRender(); }
function render(){ const d = data[cur]; const fn = VIEWS[cur]; $('#view').innerHTML = ''; try { fn(d, $('#view')); } catch(e) { $('#view').innerHTML = `<div class="empty">Render error: ${esc(e.message)}</div>`; console.error(e); } }

// ------------------------------------------------------------------ drawer
function openDrawer(title, sub, renderFn){
  drawerRender = () => { $('#dtitle').innerHTML = title; $('#dsub').innerHTML = sub || ''; $('#dbody').innerHTML = ''; renderFn($('#dbody')); };
  drawerRender(); $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden','false');
}
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden','true'); drawerRender = null; if (location.hash.includes('/')) history.replaceState(null,'',location.pathname+location.search+'#'+cur); }
$('#dclose').onclick = closeDrawer; addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

// ------------------------------------------------------------------ generic table
// cols: [{k,label,get(row),render?(row),num?,w?,lead?,hm? (hide on phone),full? (full row on phone)}], filters: [{k,label,get(row)}], state: persisted {sort,dir,q,f:{k:[vals]}}
// Short by default: `lim` rows (20 desktop, 6 phone) then "Show more"; filters sit behind one Filters button, active ones stay visible.
const LIM = new WeakMap();
function table(el, {cols, rows, filters=[], state, onRow, empty='Nothing here', searchKeys, lim: lim0, noun='rows'}){
  state.f = state.f || {};
  const base = lim0 || (phone() ? 6 : 20), step = phone() ? 20 : 50;
  const wrap = document.createElement('div');
  const tb = document.createElement('div'); tb.className = 'toolbar';
  tb.innerHTML = `<input type="search" placeholder="Search…" value="${esc(state.q||'')}" aria-label="Search">${filters.length ? '<button class="chip" data-fbtn></button>' : ''}<span class="chips" data-act></span><span class="cnt"></span><div class="fpanel hide"></div>`;
  const fbtn = $('[data-fbtn]', tb), act = $('[data-act]', tb), cnt = $('.cnt', tb), panel = $('.fpanel', tb);
  const tw = document.createElement('div'); tw.className='tw';
  wrap.append(tb, tw); el.appendChild(wrap);
  if (fbtn) fbtn.onclick = () => { state.fo = !state.fo; draw(); };
  const toggle = (f, v) => { const sel = state.f[f.k] || []; const i = sel.indexOf(v); if (i>=0) sel.splice(i,1); else sel.push(v); state.f[f.k] = sel; LIM.delete(state); saveState(); draw(); };
  const draw = () => {
    // chips with counts over rows filtered by everything else
    panel.innerHTML = ''; act.innerHTML = ''; let nActive = 0;
    for (const f of filters){
      const sel = state.f[f.k] || []; nActive += sel.length;
      for (const v of sel){ const c = document.createElement('button'); c.className = 'chip on'; c.title = 'Remove this filter'; c.innerHTML = `${esc(f.fmt?f.fmt(v):v)} ✕`; c.onclick = () => toggle(f, v); act.appendChild(c); }
      if (!state.fo) continue;
      const others = rows.filter(r => passes(r, f.k));
      const counts = {}; others.forEach(r => { const v = f.get(r); (Array.isArray(v)?v:[v]).forEach(x => { if (x!=null && x!=='') counts[x] = (counts[x]||0)+1; }); });
      const vals = Object.keys(counts).sort((a,b) => f.order ? (f.order.indexOf(a)-f.order.indexOf(b)) : counts[b]-counts[a]).slice(0, f.max||12);
      if (vals.length < 2 && !sel.length) continue;
      const lbl = document.createElement('span'); lbl.className='fl'; lbl.textContent = f.label; panel.appendChild(lbl);
      const box = document.createElement('span'); box.className = 'chips'; panel.appendChild(box);
      for (const v of vals){ const c = document.createElement('button'); c.className = 'chip' + (sel.includes(v)?' on':''); c.innerHTML = `${esc(f.fmt?f.fmt(v):v)}<span class="n">${counts[v]}</span>`;
        c.onclick = () => toggle(f, v); box.appendChild(c); }
    }
    if (fbtn) { fbtn.innerHTML = `Filters${nActive ? `<span class="n">${nActive}</span>` : ''} ${state.fo ? '▴' : '▾'}`; fbtn.setAttribute('aria-expanded', !!state.fo); }
    panel.classList.toggle('hide', !state.fo || !panel.children.length);
    const q = (state.q||'').toLowerCase();
    let out = rows.filter(r => passes(r) && (!q || (searchKeys ? searchKeys(r) : cols.map(c=>c.get(r)).join(' ')).toLowerCase().includes(q)));
    const sc = cols.find(c => c.k === state.sort) || cols[0]; const dir = state.dir || (sc.num ? -1 : 1);
    out.sort((a,b) => { let x = sc.get(a), y = sc.get(b); if (x==null) return 1; if (y==null) return -1; if (sc.num) return (x-y)*dir; return String(x).localeCompare(String(y))*dir; });
    const lim = LIM.get(state) || base;
    cnt.textContent = out.length === rows.length ? (out.length > lim ? `showing ${lim} of ${rows.length.toLocaleString('en-US')} ${noun}` : `${rows.length} ${noun}`) : `${out.length.toLocaleString('en-US')} of ${rows.length.toLocaleString('en-US')} match`;
    if (!out.length) { tw.innerHTML = `<div class="empty">${empty}</div>`; return; }
    const cell = (c, r) => { const h = c.render ? c.render(r) : esc(c.get(r)); const nil = h === '' || h == null || h === '—' || /^<span class="muted">(-|—)?<\/span>$/.test(h);
      return `<td data-l="${esc(c.label)}" class="${c.num?'right num':''} ${c.lead?'lead':''} ${c.hm?'hm':''} ${c.full?'full':''} ${nil?'nil':''}"><span class="cell">${h ?? ''}</span></td>`; };
    tw.innerHTML = `<table><thead><tr>${cols.map(c => `<th class="${c.k===sc.k?'on':''} ${c.num?'right':''}" data-k="${c.k}" style="${c.w?'width:'+c.w:''}">${esc(c.label)}${c.k===sc.k?`<span class="arr">${dir>0?'▲':'▼'}</span>`:''}</th>`).join('')}</tr></thead><tbody>${
      out.slice(0, lim).map((r,i) => `<tr class="${onRow?'click':''}" data-i="${i}">${cols.map(c => cell(c, r)).join('')}</tr>`).join('')
    }</tbody></table>`;
    if (out.length > lim || lim > base) { const m = document.createElement('div'); m.className = 'row'; m.style.cssText = 'gap:8px';
      m.innerHTML = (out.length > lim ? `<button class="more" data-a="more">Show ${Math.min(step, out.length-lim)} more (${(out.length-lim).toLocaleString('en-US')} left)</button>` : '') + (lim > base ? `<button class="more" data-a="less" style="flex:0 0 auto;width:auto;padding:9px 14px">Show fewer</button>` : '');
      tw.after(m); wrap._more && wrap._more.remove(); wrap._more = m;
      m.querySelectorAll('button').forEach(b => b.onclick = () => { if (b.dataset.a === 'more') LIM.set(state, lim + step); else LIM.delete(state); draw(); });
    } else if (wrap._more) { wrap._more.remove(); wrap._more = null; }
    tw.querySelectorAll('th').forEach(th => th.onclick = () => { if (state.sort === th.dataset.k) state.dir = -(state.dir || (sc.num?-1:1)); else { state.sort = th.dataset.k; const c = cols.find(c=>c.k===th.dataset.k); state.dir = c.num ? -1 : 1; } saveState(); draw(); });
    if (onRow) tw.querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => onRow(out[+tr.dataset.i]));
  };
  const passes = (r, skip) => filters.every(f => { if (f.k === skip) return true; const sel = state.f[f.k]; if (!sel || !sel.length) return true; const v = f.get(r); return Array.isArray(v) ? v.some(x => sel.includes(x)) : sel.includes(v); });
  let qt; $('input', tb).oninput = e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value; LIM.delete(state); saveState(); draw(); }, 120); };
  draw();
}

// ------------------------------------------------------------------ charts (inline SVG, hover tooltips)
const tip = $('#tip');
function showTip(ev, html){ tip.innerHTML = html; tip.classList.add('on'); const x = Math.min(ev.clientX + 12, innerWidth - tip.offsetWidth - 8), y = Math.max(8, ev.clientY - tip.offsetHeight - 12); tip.style.left = x+'px'; tip.style.top = y+'px'; }
function hideTip(){ tip.classList.remove('on'); }
function chartWidth(el){ return Math.max(240, el.clientWidth || el.parentElement.clientWidth || 600); }
// series: [{label,color,pts:[[t,v]],resets:[t]}], opts {x0,x1,yMax,hold,h}
function lineChart(el, series, o){
  const W = chartWidth(el), H = o.h || 180, m = {t:10, r:12, b:22, l:34};
  const x0 = o.x0, x1 = o.x1, ymax = o.yMax || 100;
  const X = t => m.l + (t - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => m.t + (1 - v / ymax) * (H - m.t - m.b);
  let g = `<g class="grid">${[0,25,50,75,100].filter(v=>v<=ymax).map(v => `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${v}%</text>`).join('')}</g>`;
  if (o.hold) g += `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(o.hold)}" y2="${Y(o.hold)}" stroke="var(--serious)" stroke-dasharray="3 4"/><text x="${W-m.r}" y="${Y(o.hold)-4}" text-anchor="end" fill="var(--serious)">hold ${o.hold}%</text>`;
  const days = []; for (let t = Math.ceil(x0/86400)*86400; t < x1; t += 86400) days.push(t);
  const ticks = days.filter(t => { const d = new Date(t*1000); return true; });
  // day boundaries in ET: find local midnight marks
  const marks = []; const d0 = new Date(x0*1000); for (let i=0;i<9;i++){ const d = new Date(d0); d.setDate(d.getDate()+i); const parts = new Intl.DateTimeFormat('en-US',{timeZone:ET,year:'numeric',month:'2-digit',day:'2-digit'}).format(d); const midnight = Date.parse(parts.replace(/(\d+)\/(\d+)\/(\d+)/,'$3-$1-$2')+'T00:00:00')/1000; marks.push(midnight); }
  const offs = (new Date(x1*1000)).getTimezoneOffset()*60; // rough: the ET midnight label; exact labelling uses fmtWd below
  g += marks.filter(t => t>x0 && t<x1).map(t => `<line x1="${X(t)}" x2="${X(t)}" y1="${m.t}" y2="${H-m.b}" stroke="var(--line)"/><text x="${X(t)+3}" y="${H-6}">${fmtWd.format(new Date((t+offs)*1000))}</text>`).join('');
  g += `<line class="axis" x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}"/>`;
  for (const s of series){
    if (!s.pts.length) continue;
    g += `<path class="ln" stroke="${s.color}" d="${s.pts.map((p,i) => (i?'L':'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ')}"/>`;
    g += (s.resets||[]).map(t => `<path d="M${X(t)} ${H-m.b-1} l-4 7 h8z" fill="${s.color}"/>`).join('');
    const last = s.pts[s.pts.length-1]; g += `<circle cx="${X(last[0])}" cy="${Y(last[1])}" r="3.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}<rect class="hit" x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}"/><line id="xh" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" stroke="var(--line2)" style="display:none"/></svg>` +
    (series.length>1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')}<span class="muted">▲ reset</span></div>` : '');
  const svg = $('svg', el), xh = $('#xh', el), hit = $('.hit', el);
  hit.onmousemove = ev => { const r = svg.getBoundingClientRect(); const t = x0 + (ev.clientX - r.left) / r.width * W > 0 ? x0 + ((ev.clientX - r.left) / r.width * W - m.l) / (W - m.l - m.r) * (x1 - x0) : x0;
    xh.setAttribute('x1', X(t)); xh.setAttribute('x2', X(t)); xh.style.display = '';

  items.forEach((it,i) => { let acc = 0; const x = m.l + i*bw + gap/2, w = bw - gap;
    keys.forEach(k => { const v = it.parts[k.k]||0; if (!v) return; const y1 = Y(acc), y0 = Y(acc+v); acc += v;
      g += `<rect x="${x}" y="${y0}" width="${w}" height="${Math.max(0, y1-y0-1)}" fill="${k.color}" rx="${acc===v?0:0}" data-i="${i}" data-k="${k.k}"/>`; });
    if (items.length <= 16 || i % Math.ceil(items.length/(innerWidth < 600 ? 6 : 12)) === 0) g += `<text x="${x+w/2}" y="${H-5}" text-anchor="middle">${esc(it.label)}</text>`; });

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}</svg><div class="legend">${keys.map(k => `<span><i style="background:${k.color}"></i>${esc(k.label)}</span>`).join('')}</div>`;
  el.querySelectorAll('rect').forEach(r => { r.onmousemove = ev => { const it = items[+r.dataset.i]; const tot = keys.reduce((s,k)=>s+(it.parts[k.k]||0),0); showTip(ev, `<b>${esc(it.title||it.label)}</b> · ${tot} total<br>${keys.filter(k=>it.parts[k.k]).map(k=>`${esc(k.label)} ${it.parts[k.k]}`).join(' · ')}`); }; r.onmouseleave = hideTip; });

function gateWords(g, src){

// ---------- patch notes (owner 11-24): one collapsible card per release, newest first, with search and jump chips.
// State (search text, which cards are open) lives in fstate('patches').notes so the 60 s refresh does not reset it.
function patchNotesMount(el, p, fs){
  const notes = p.patch_notes || [], S = fs.notes = fs.notes || {open: {}, q: ''}, CAP = 5;
  const CLS = {'New':'s-new','Fixes':'s-fix','Performance':'s-perf','Art & models':'s-art'};
  const box = $('#pn', el);
  if (!notes.length){ box.innerHTML = sectionH('Patch notes') + '<div class="card muted small">No patch notes yet. The patch-notes tool writes one file per release into the data folder.</div>'; return; }
  const hl = (t, q) => { const s = esc(t); if (!q) return s; const i = s.toLowerCase().indexOf(esc(q).toLowerCase()); return i < 0 ? s : s.slice(0,i) + '<mark>' + s.slice(i, i+esc(q).length) + '</mark>' + s.slice(i+esc(q).length); };
  box.innerHTML = sectionH('Patch notes', `newest first · notes written ${esc(ago(p.patch_notes_at))} · checked every 60 s`) + `
    <div class="pn-bar"><input type="search" id="pnq" placeholder="Search the notes (a hunter, a fix, a word)…" aria-label="Search patch notes" value="${esc(S.q)}"><button id="pnopen">Open all</button><button id="pnshut">Close all</button><span class="small muted" id="pncnt"></span></div>
    <div id="pnlist"></div><button class="more" id="pnmore" hidden></button>`;
  const list = box.querySelector('#pnlist');
  const draw = () => {
    const q = (S.q || '').trim(), ql = q.toLowerCase(); let hits = 0, cards = 0;
    list.innerHTML = notes.map((n, i) => {
      const headHit = ql && (n.tag + ' ' + n.headline).toLowerCase().includes(ql);
      const secs = n.sections.map(s => ({t: s.title, b: s.bullets.filter(b => !ql || headHit || b.toLowerCase().includes(ql))})).filter(s => s.b.length);
      if (ql && !secs.length && !headHit) return '';
      if (!ql && !S.all && i >= CAP) return '';
      cards++; const nb = secs.reduce((a, s) => a + s.b.length, 0); hits += ql ? nb : 0;
      const open = ql ? true : (S.open[n.tag] != null ? S.open[n.tag] : i === 0);
      return `<details class="pn-card" id="pn-${esc(n.tag)}" data-tag="${esc(n.tag)}"${open ? ' open' : ''}><summary><span class="pn-v">${esc(n.tag)}</span><span class="pn-d">${esc(n.published ? tDay(n.published) : (n.date || ''))}</span><span class="pn-n">${nb} note${nb === 1 ? '' : 's'}</span><span class="pn-h">${hl(n.headline, q)}</span></summary>
        <div class="pn-body">${secs.map(s => `<div class="pn-sec ${CLS[s.t] || ''}"><h4>${esc(s.t)}</h4><ul>${s.b.map(b => `<li>${hl(b, q)}</li>`).join('')}</ul></div>`).join('')}</div></details>`;
    }).join('') || '<div class="empty">Nothing matches that.</div>';
    box.querySelector('#pncnt').textContent = ql ? `${hits} match${hits === 1 ? '' : 'es'} in ${cards} patch${cards === 1 ? '' : 'es'}` : `${notes.length} patches`;
    const mb = box.querySelector('#pnmore'); mb.hidden = !!ql || notes.length <= CAP; mb.textContent = S.all ? 'Show fewer patches' : `Show ${notes.length - CAP} older patches`;
    list.querySelectorAll('details').forEach(d => d.addEventListener('toggle', () => { if (!(S.q || '').trim()) S.open[d.dataset.tag] = d.open; }));
  };
  draw();
  const q = box.querySelector('#pnq'); q.oninput = () => { S.q = q.value; draw(); };
  box.querySelector('#pnmore').onclick = () => { S.all = !S.all; draw(); };
  box.querySelector('#pnopen').onclick = () => { S.q = ''; q.value = ''; S.all = true; notes.forEach(n => S.open[n.tag] = true); draw(); };
  box.querySelector('#pnshut').onclick = () => { S.q = ''; q.value = ''; notes.forEach(n => S.open[n.tag] = false); draw(); };
}

  table($('#hc', el), {state: fs.hc = fs.hc || {}, rows: s.hcloud.servers, empty: s.sources.hcloud.ok ? 'no servers' : 'Hetzner Cloud not connected',
    cols: [{k:'name',label:'Server',get:x=>x.name,lead:true},{k:'status',label:'Status',get:x=>x.status,render:x=>badge(x.status==='running'?'online':'offline',x.status)},{k:'type',label:'Type',get:x=>x.type},{k:'cores',label:'Cores',get:x=>x.cores,num:true},{k:'mem',label:'RAM',get:x=>x.mem_gb,num:true,render:x=>x.mem_gb+' GB'},{k:'loc',label:'Location',get:x=>x.location},{k:'price',label:'$/h',get:x=>x.price_hr,num:true,render:x=>money(x.price_hr,4)},{k:'created',label:'Created',get:x=>x.created,num:true,render:x=>esc(tDay(x.created))}]});

  ${c.hosts.map(h => h.online ? `<tr><td class="lead"><b>${esc(h.name)}</b></td><td class="muted" data-l="Kind">${esc(h.kind)}</td><td class="num right" data-l="Cores">${h.cores ?? '-'}</td><td style="min-width:110px" data-l="Busy"><span class="cell">${h.cpu_pct == null ? '-' : Math.round(h.cpu_pct) + '%' + meter(h.cpu_pct, tone(h.cpu_pct))}</span></td><td class="num right" data-l="Jobs / slots">${h.jobs}${h.slots == null ? '' : ' / ' + h.slots}</td><td class="num right" data-l="Godot">${h.godot ?? '-'}</td><td class="${h.idle?'':'nil'}">${h.idle ? vd('watch', 'Idle') : ''}</td></tr>`
    : `<tr><td class="lead"><b>${esc(h.name)}</b></td><td class="muted" data-l="Kind">${esc(h.kind)}</td><td colspan="5" class="full">${badge('offline', 'no reading')} <span class="small muted">${esc(h.err || '')}</span></td></tr>`).join('')}</tbody></table></div>`)}

  const W = 600, Hh = 110, t0 = now() - 86400;
  const lines = keys.map(([k, col]) => { const pts = hist.filter(r => typeof r[k] === 'number').map(r => `${((r.t - t0) / 86400 * W).toFixed(1)},${(Hh - 4 - Math.min(100, r[k]) / 100 * (Hh - 8)).toFixed(1)}`);
    return pts.length > 1 ? `<polyline fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" points="${pts.join(' ')}"/>` : ''; }).join('');

  $('#capleg', el).innerHTML = keys.map(([k, col, n]) => `<span style="margin-right:14px"><i class="dot" style="background:${col}"></i> ${n}</span>`).join('');
  if (!window._capTick) window._capTick = setInterval(() => {
    if (cur !== 'capacity') { clearInterval(window._capTick); window._capTick = null; return; }

  if (!window._capPoll) { let lastH = 0; window._capPoll = setInterval(async () => {
    if (cur !== 'capacity') { clearInterval(window._capPoll); window._capPoll = null; return; }

  }, 5000);
  api('/admin/capacity/history?hours=24').then(h => { lastH = now(); window._caphist = h.points || []; if (cur === 'capacity') render(); }).catch(() => {}); }
};
VIEWS.system = (c, el) => {
  // How automated the dev system is getting. system-score refreshes the file hourly; every number carries a plain verdict and its change.
  const VC = {good:'var(--good)', watch:'var(--warn)', bad:'var(--crit)'}, VW = {good:'Good', watch:'Watch', bad:'Bad'};
  const dl = (d, better, unit) => {
    if (d == null) return '<span class="muted">n/a</span>';
    if (d === 0) return '<span class="muted">no change</span>';
    const ok = (d > 0) === (better === 'up'), u = unit === '%' ? ' pts' : '';
    return `<span style="color:${ok ? 'var(--good)' : 'var(--crit)'}">${d > 0 ? '&#9650;' : '&#9660;'} ${Math.abs(d)}${u}</span>`;
  };
  const dayLbl = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', {weekday: 'short', month: 'numeric', day: 'numeric'});
  const h = c.headline, hv = VC[h.verdict] || 'var(--muted)';
  const tile = m => stat({label: m.label, value: m.value == null ? '<span class="muted" style="font-size:16px">not tracked yet</span>' : esc(m.value), unit: m.value == null ? '' : m.unit, v: m.verdict, word: VW[m.verdict], line: esc(m.why),
    sub: `<span class="deltas"><span>vs yesterday ${dl(m.dod, m.better, m.unit)}</span><span>vs 7 days ago ${dl(m.wow, m.better, m.unit)}</span></span>`});
  const days = c.days || [];
  const trend = (k, col, t) => `<div class="card"><h3>${t}</h3>${sparkline(days.map(r => r[k] || 0), col, 240, 40)}<div class="small muted" style="display:flex;justify-content:space-between;margin-top:4px"><span>${days.length ? esc(dayLbl(days[0].day)) : ''}</span><span>${days.length ? esc(dayLbl(days[days.length - 1].day)) : ''}</span></div></div>`;
  const th = c.thresholds || {};
  const lim = (k, f) => th[k] ? f(th[k][0], th[k][1]) : '';
  const catches = (c.recent_catches || []).map(r => `<div><div>${esc(r.what)}</div>
    <div class="note" style="margin-top:3px">${esc(dayLbl(r.day))} &middot; ${esc(r.category)}${r.repeat ? ' &middot; <b class="vc v-bad">repeat</b>' : ''}${r.check_built ? ' &middot; check built: ' + esc(r.check_built) : ' &middot; no check yet'}</div></div>`);
  el.innerHTML = `<div class="hero v-${vOf(h.verdict)||'none'}">
    <div class="lbl">Self-caught: problems the system found before you did</div>
    <div class="kpi vc">${h.score == null ? '<span class="muted" style="font-size:16px">no data yet</span>' : esc(h.score) + '<small>% (goal 90%)</small>'}</div>
    ${h.score == null ? '' : meter(h.score, hv)}
    <div class="verdict">${vd(h.verdict, VW[h.verdict])}<span>${esc(h.sentence)}</span></div>
    <div class="note" style="margin-top:6px">As of ${esc(ago(c.ts))} · refreshed every hour</div></div>
  ${sectionH('Today', 'with change vs yesterday and vs 7 days ago')}
  <div class="grid tiles">${c.metrics.map(tile).join('')}</div>
  ${sectionH('Last 14 days', 'one bar per day')}
  <div class="grid cols3">${trend('owner', 'var(--crit)', 'You had to catch')}${trend('system', 'var(--good)', 'System caught')}${trend('merges', 'var(--accent)', 'Merged to main')}</div>
  ${fold('sys-days', 'Day by day', `${days.length} days`, `<div class="tw"><table class="plain"><thead><tr><th>Day</th><th class="right">You caught</th><th class="right">Repeats</th><th class="right">System caught</th><th class="right">Merges</th></tr></thead><tbody>
  ${days.slice().reverse().map(r => `<tr><td class="lead">${esc(dayLbl(r.day))}</td><td class="num right" data-l="You caught">${r.owner}</td><td class="num right" data-l="Repeats">${r.repeat}</td><td class="num right" data-l="System caught">${r.system}${r.partial_system ? ' <span class="muted" title="alert history only counts what left a dated record">*</span>' : ''}</td><td class="num right" data-l="Merges">${r.merges ?? '-'}</td></tr>`).join('')}</tbody></table></div>`)}
  ${sectionH('Latest things you caught', 'newest first')}
  <div class="card">${catches.length ? capped('sys-catch', catches, 4, x => `<div class="list">${x}</div>`) : '<div class="empty">None recorded yet.</div>'}</div>
  ${fold('sys-how', 'How to read the verdicts', 'the limits behind Good / Watch / Bad', `<div class="note">
    You had to catch: good at ${lim('owner_catches', (g, w) => g + ' or fewer a day')}, watch up to ${lim('owner_catches', (g, w) => w)}, bad above. Repeat catches: good at zero, watch up to ${lim('repeat_catches', (g, w) => w)}.
    System caught: good at ${lim('system_catches', (g, w) => g + ' or more a day')}, watch at ${lim('system_catches', (g, w) => w)}, bad at zero.
    Self-caught: good at ${lim('self_caught_pct', (g, w) => g + '% or more')}, watch from ${lim('self_caught_pct', (g, w) => w + '%')}, bad below; counted over 7 days.
    Checks built: good at ${lim('covered_pct', (g, w) => g + '% or more')}, watch from ${lim('covered_pct', (g, w) => w + '%')}.
    Alerts open over 6 hours: good at zero, watch up to ${lim('open_over_6h', (g, w) => w)}. Merges: good at ${lim('merges_per_day', (g, w) => g + ' or more a day')}, watch from ${lim('merges_per_day', (g, w) => w)}.
    Green PR wait: good at ${lim('green_wait_h', (g, w) => g + ' hour or less')}, watch up to ${lim('green_wait_h', (g, w) => w + ' hours')}. Owner actions waiting: good at ${lim('owner_actions', (g, w) => g + ' or fewer')}, watch up to ${lim('owner_actions', (g, w) => w)}.
    Promises on time: good at ${lim('promises_pct', (g, w) => g + '% or more')}, watch from ${lim('promises_pct', (g, w) => w + '%')}.
    Days marked * count only alerts that left a dated record, so they read low. Alerts the system raises are counted from the first hourly run. The thresholds are constants at the top of system-score.</div>`)}
  <div class="small" style="margin-top:var(--s3)"><a href="#capacity">Computer and GPU use: see the Capacity tab</a></div>`;
};

// Merge & backlog tracker (merge_tracker.py): from /admin/backlog (tracker), else /admin/overview (merge), else the numbers-only
// copy embedded in the usage page (#merge-tracker), which needs no API restart.
async function mtData(b){
  if (b.tracker && b.tracker.unmerged) return b.tracker;
  if (data.home && data.home.merge && data.home.merge.unmerged) return data.home.merge;
  try { const o = await api('/admin/overview'); if (o.merge && o.merge.unmerged) return o.merge; } catch(e) {}
  const u = await api('/admin/usage'); const m = (u.html||'').match(/<script type="application\/json" id="merge-tracker">([\s\S]*?)<\/script>/);
  if (!m) throw new Error('tracker not found'); return JSON.parse(m[1]);
}

// Up = gain (worse, red), down = loss (better, green).
function mtHourHTML(t){
  if (!t.last_hour || !t.hourly) return '';
  const sg = c => c == null ? '—' : (c > 0 ? '+' + c : String(c)), cv = c => c == null || !c ? 'none' : c > 0 ? 'bad' : 'good';
  const row = h => `<tr><td class="lead">${esc(fmtT.format(new Date(h.t*1000)))}–${esc(fmtT.format(new Date((h.t+3600)*1000)))}</td><td class="num right" data-l="Waiting"><b>${h.waiting ?? '—'}</b></td><td class="num right" data-l="Change"><b class="vc v-${cv(h.change)}">${sg(h.change)}</b>${h.other ? ` <span class="muted" title="joined or dropped off the list with no dated READY post or merge">(${sg(h.other)} other)</span>` : ''}</td><td class="num right" data-l="New finished">${h.new}</td><td class="num right" data-l="Landed / closed">${h.left ?? '—'}${h.left != null && h.landed != null && h.left !== h.landed ? ` <span class="muted">(${h.landed} landed)</span>` : ''}</td><td class="num right" data-l="PRs merged">${h.merged}</td></tr>`;
  return fold('bl-hours', 'Hour by hour, last 24 h', 'waiting at the end of each hour · ET, newest first', `<div class="tw"><table class="plain"><thead><tr><th>Hour</th><th class="right">Waiting</th><th class="right">Change</th><th class="right">New finished</th><th class="right">Landed / closed</th><th class="right">PRs merged</th></tr></thead>
    <tbody>${t.hourly.slice().reverse().map(row).join('')}</tbody></table></div>
    <div class="note" style="margin-top:8px">Change = new branches minus branches that landed or closed. One merged PR can carry many branches (bundles). "Landed / closed" counts branches that landed on main plus branches closed or retired without landing (the number in brackets is the part that landed). "PRs merged" counts real GitHub PRs only. "other" = branches that joined or dropped off the list with no dated READY post or merge (archived, set aside, restored); it makes the row add up.</div>`);

  const ny = a.needs_you || {items:[]}, n = (ny.items || []).length, C = a.counts;
  const lv = l => vOf(l) || 'none', rank = {bad:0, watch:1, none:2, good:3};
  const rows = list => list.slice().sort((x, y) => rank[lv(x.level)] - rank[lv(y.level)]).map(f => `<li class="v-${lv(f.level)}"><span class="arow-d"></span><span>${esc(plain(f.text))}</span></li>`);
  const worst = list => list.reduce((w, f) => rank[lv(f.level)] < rank[w] ? lv(f.level) : w, 'good');
  const box = (key, title, list, none, sub) => { const w = list.length ? worst(list) : 'good'; return `<div class="card v-${w === 'none' ? 'good' : w}"><div class="hh"><h3 style="margin:0">${title}</h3>${vd(w === 'none' ? 'good' : w, list.length ? `${list.length} open` : 'Clear')}</div>${list.length ? capped(key, rows(list), 6, x => `<ul class="arows">${x}</ul>`) : `<div class="note">${none}</div>`}${sub || ''}</div>`; };
  el.innerHTML = srcLine(a.sources) + `<div class="hero ${n ? 'v-watch' : 'v-good'}"><div class="hh"><b>${n ? `${n} thing${n > 1 ? 's' : ''} need${n > 1 ? '' : 's'} you` : 'Nothing needs you'}</b><span class="small muted">updated ${esc(ago(ny.updated))}</span></div>
    ${n ? `<ol class="todo">${ny.items.map(i => `<li>${esc(i)}</li>`).join('')}</ol>` : '<div class="note">The coordinator has no open questions for you.</div>'}</div>
  ${sectionH('Problems right now', C ? `${C.problems} open · ${C.need_action ? `<b class="vc v-bad">${C.need_action} need action from you</b>` : 'none need action from you'}` : '')}
  <div class="grid cols2">
    ${box('al-fleet', 'Agents and merges', a.fleet || [], 'No fleet alerts.', `<div class="note" style="margin-top:8px">Checked ${esc(ago(a.fleet_at))}</div>${a.fleet_summary ? fold('al-sum', 'Fleet summary line', '', `<div class="note">${esc(a.fleet_summary)}</div>`, {plain: true}) : ''}`)}
    ${box('al-sys', 'Servers and accounts', a.system || [], 'All checks pass.')}
  </div>
  ${sectionH('Alert log', `${(a.log || []).length} entries, newest first`)}<div class="card">${(a.log || []).length ? capped('al-log', a.log.map(l => `<li class="v-none"><span class="t">${esc(l.t ? tShort(l.t) : '')}</span><span>${esc(plain(l.text))}</span></li>`), 5, x => `<ul class="arows log">${x}</ul>`) : '<div class="muted">empty</div>'}</div>`;
};

// ---------- signups
const SU_DAY = 86400, etDay = e => new Intl.DateTimeFormat('en-CA',{timeZone:ET}).format(new Date(e*1000));   // YYYY-MM-DD in ET
function csvCell(v){ v = String(v ?? ''); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }   // quoted, and a leading = + - @ is neutralised (spreadsheet formula injection)
function signupsCsv(rows){
  const head = ['email','source','date_et','verified','referred_by','referred_by_email','ref_code','utm_source','utm_campaign','came_from','country','device','internal'];
  return [head.join(',')].concat(rows.map(r => [r.email, r.source, tEST(r.created), r.verified?'yes':'no', r.referred_by, (signupsCsv.owner||{})[r.referred_by]||'', r.ref_code, r.utm_source, r.utm_campaign, r.ref_domain, r.country, r.device, r.internal?'yes':'no'].map(csvCell).join(','))).join('\r\n') + '\r\n';
}
function downloadText(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function cameFrom(r){ return r.utm_source || (r.ref_domain && r.ref_domain !== '$direct' ? r.ref_domain : '') || (r.ref_domain === '$direct' ? 'direct' : ''); }
function signupStats(all, withInternal){
  const rows = withInternal ? all : all.filter(r => !r.internal);
  const ver = rows.filter(r => r.verified).length, t = now();
  const days = []; for (let i = 29; i >= 0; i--) days.push(etDay(t - i*SU_DAY));
  const per = Object.fromEntries(days.map(d => [d, {v:0, u:0}]));
  rows.forEach(r => { const d = per[etDay(r.created)]; if (d) (r.verified ? d.v++ : d.u++); });
  const last7 = rows.filter(r => r.created >= t - 7*SU_DAY).length, prev7 = rows.filter(r => r.created >= t - 14*SU_DAY && r.created < t - 7*SU_DAY).length;
  const tally = f => { const m = {}; rows.forEach(r => { const k = f(r) || 'unknown'; m[k] = (m[k]||0) + 1; }); return Object.entries(m).sort((a,b) => b[1]-a[1]); };
  // referral leaderboard: referred_by holds the referrer's ref_code; ref_code -> email comes from the referrer's own row
  const owner = {}; all.forEach(r => { if (r.ref_code) owner[r.ref_code] = r.email; });
  const lb = {}; rows.forEach(r => { if (!r.referred_by) return; const e = lb[r.referred_by] = lb[r.referred_by] || {code:r.referred_by, n:0, v:0, kids:[]}; e.n++; if (r.verified) e.v++; e.kids.push(r); });
  const board = Object.values(lb).sort((a,b) => b.n - a.n || b.v - a.v).map(e => ({...e, who: owner[e.code] || ''}));
  return {rows, ver, days, per, last7, prev7, bySource: tally(r => r.source), byCame: tally(cameFrom), byCountry: tally(r => r.country), board, owner, hidden: all.length - rows.length};
}
VIEWS.signups = (s, el) => {
  const all = s.rows || s.last || [], ph = s.posthog, fs = fstate('signups');
  const note = ph && ph !== 'ok' ? `<div class="small" style="margin-bottom:12px;color:var(--crit)">${ph === 'no key' ? 'PostHog not connected (no API key on the server): showing only signups stored since the backup path went live.' : 'PostHog lookup failed (' + esc(ph) + '): showing only locally stored signups.'}</div>` : '';
  const x = signupStats(all, !!fs.internal), n = x.rows.length, rate = n ? Math.round(x.ver / n * 100) : 0;
  const delta = x.last7 - x.prev7, refd = x.rows.filter(r => r.referred_by).length;
  const dv = delta > 0 ? 'good' : delta < 0 ? 'watch' : '';
  el.innerHTML = `${note}<div class="grid tiles">
    ${stat({label:'Waitlist', value: n, unit:'people', v: s.enabled ? '' : 'watch', word: s.enabled ? '' : 'Signups closed', sub: `${s.enabled ? 'signups open' : 'signups closed'}${x.hidden ? ` · ${x.hidden} internal/test hidden` : ''}`})}
    ${stat({label:'Verified', value: x.ver, unit:`of ${n} · ${rate}%`, extra: meter(x.ver, 'var(--good)', Math.max(1, n)), sub:'clicked the link in the welcome email'})}
    ${stat({label:'Last 7 days', value: x.last7, unit:'new', v: dv, word: delta > 0 ? 'Up' : delta < 0 ? 'Down' : '', line: `${delta > 0 ? '+' : ''}${delta} vs the week before`, sub: `${x.prev7} the week before`})}
    ${stat({label:'Referred', value: refd, unit:`${n ? Math.round(refd/n*100) : 0}%`, sub:'joined through an invite link'})}</div>
  ${sectionH('Signups per day', 'last 30 days, ET')}<div class="card"><div id="su-days"></div></div>
  <div class="grid cols3" style="margin-top:14px">
    <div class="card"><h3>Form</h3>${hbars(x.bySource.slice(0,8).map(([k,v]) => ({label:k, v})))||'<div class="muted">none</div>'}</div>
    <div class="card"><h3>Came from</h3>${hbars(x.byCame.slice(0,8).map(([k,v]) => ({label:k, v}))) || '<div class="muted">none</div>'}<div class="small muted" style="margin-top:6px">UTM source if the link had one, else the site they came from. UTM tags are recorded from now on.</div></div>
    <div class="card"><h3>Who referred who</h3>${x.board.length ? capped('su-board', x.board.slice(0,20).map(b => `<div><div class="row"><span class="mono ell">${esc(b.who || b.code)}</span><span class="grow"></span><span class="num">${b.n} <span class="muted small">(${b.v} verified)</span></span></div><div class="small muted" style="margin:0 0 8px 12px">${b.kids.map(k => `<div class="mono ell">→ ${esc(k.email)}${k.verified ? ' ✓' : ''}</div>`).join('')}</div></div>`), 4, h => `<div class="list">${h}</div>`) : '<div class="muted">No referred signups yet.</div>'}</div></div>
  ${sectionH('All signups', 'newest first · the only place an email is shown')}
  <div class="toolbar"><button class="chip ${fs.internal?'on':''}" id="su-int" title="Our own and test addresses">Show internal/test${x.hidden ? `<span class="n">${x.hidden}</span>` : ''}</button><button class="chip" id="su-csv">Download CSV</button></div><div id="tbl"></div>`;
  stackedBars($('#su-days', el), x.days.map(d => ({label: d.slice(5).replace('-','/'), title: d, parts: {v: x.per[d].v, u: x.per[d].u}})), [{k:'v',label:'Verified',color:'var(--good)'},{k:'u',label:'Not verified yet',color:'var(--c-cory)'}], {h:150});
  $('#su-int', el).onclick = () => { fs.internal = !fs.internal; saveState(); render(); };
  $('#su-csv', el).onclick = () => { signupsCsv.owner = x.owner; downloadText('boki-signups-' + etDay(now()) + '.csv', signupsCsv(x.rows), 'text/csv'); }
  fs.tbl = fs.tbl || {sort:'created',dir:-1};
  table($('#tbl', el), {state: fs.tbl, rows: x.rows, lim: innerWidth < 720 ? 6 : 12, noun: 'signups', filters:[{k:'source',label:'Form',get:r=>r.source||''},{k:'verified',label:'Status',get:r=>r.verified?'verified':'not verified'}], cols: [
    {k:'email',label:'Email',get:r=>r.email,lead:true,render:r=>`<span class="mono">${esc(r.email)}</span>${r.internal?' <span class="badge s-skipped">internal</span>':''}`},
    {k:'source',label:'Form',hm:true,get:r=>r.source||''},
    {k:'created',label:'Date (ET)',get:r=>r.created,num:true,render:r=>esc(tEST(r.created))},
    {k:'verified',label:'Verified',get:r=>r.verified?1:0,render:r=>r.verified?'yes':'no'},
    {k:'came',label:'Came from',hm:true,get:r=>cameFrom(r),render:r=>esc(cameFrom(r)) || '<span class="muted">-</span>'},
    {k:'country',label:'Country',hm:true,get:r=>r.country||'',render:r=>esc(r.country||'') || '<span class="muted">-</span>'},
    {k:'referred_by',label:'Referred by',get:r=>r.referred_by?(x.owner[r.referred_by]||r.referred_by):'',render:r=>r.referred_by?`<span class="mono">${esc(x.owner[r.referred_by]||r.referred_by)}</span>`:'<span class="muted">-</span>'},
    {k:'brought',label:'Brought in',hm:true,get:r=>{const b=r.ref_code&&x.board.find(e=>e.code===r.ref_code); return b?b.n:0;},num:true,render:r=>{const b=r.ref_code&&x.board.find(e=>e.code===r.ref_code); return b?`<span title="${esc(b.kids.map(k=>k.email).join(', '))}">${b.n}</span>`:'<span class="muted">0</span>';}}]});
};

// ---------- site traffic (PostHog, 30 days; the server caches it for 5 minutes)
VIEWS.site = (t, el) => {
  if (t.status !== 'ok') { el.innerHTML = `<div class="card"><h3>Site traffic</h3><div class="muted">${t.status === 'no key' ? 'PostHog is not connected on the server (no API key).' : 'PostHog lookup failed (' + esc(t.status || 'no data') + '). Try again in a minute.'}</div></div>`; return; }
  const T = t.totals, F = t.funnel, dayLabel = d => fmtD.format(new Date(d + 'T12:00:00Z'));
  const conv = (a, b) => b ? (a / b * 100).toFixed(1).replace(/\.0$/, '') + '%' : '-';
  const maxV = Math.max(1, F.visitors);
  const step = (label, v, color) => `<div class="hbar" style="grid-template-columns:90px 1fr 110px"><span>${label}</span><div class="bar"><i style="width:${Math.max(1, v / maxV * 100)}%;background:${color}"></i></div><span class="num right">${v} <span class="muted small">${conv(v, maxV)}</span></span></div>`;
  const ref = [{label:'Direct / none', v:t.direct_views, color:'var(--muted)'}].concat(t.referrers.map(r => ({label:r.domain, v:r.views}))).concat(t.self_views ? [{label:'Our own site', v:t.self_views, color:'var(--muted)'}] : []);
  el.innerHTML = `<div class="grid tiles">
    ${stat({label:'Visitors, 7 days', value: T.visitors_7d, unit:'people', sub:`${T.views_7d} pageviews`})}
    ${stat({label:'Visitors, 30 days', value: T.visitors_30d, unit:'people', sub:`${T.views_30d} pageviews`})}
    ${stat({label:'Visit to signup', value: conv(F.signups, F.visitors), sub:`${F.signups} signups from ${F.visitors} visitors, 30 days`, href:'#signups'})}
    ${stat({label:'Signup to verified', value: conv(F.verified, F.signups), sub:`${F.verified} of ${F.signups} clicked the email link`})}</div>
  ${sectionH('Visitors and pageviews per day', 'last 30 days, UTC days')}<div class="card"><div id="tr-days"></div>
    <div class="small muted" style="margin-top:6px">Visitors is an upper bound: before cookie consent a returning person can count twice.</div></div>
  <div class="grid cols2" style="margin-top:14px">
    <div class="card"><h3>Funnel, 30 days</h3>${step('Visitors', F.visitors, 'var(--c-cory)')}${step('Signed up', F.signups, 'var(--c-coord)')}${step('Verified', F.verified, 'var(--good)')}<div class="small muted" style="margin-top:6px">Signups exclude internal/test addresses.</div></div>
    <div class="card wide"><h3>Top pages</h3>${hbars(t.pages.slice(0,8).map(p => ({label:p.path, v:p.views}))) || '<div class="muted">none</div>'}</div>
    <div class="card wide"><h3>Where visitors come from</h3>${hbars(ref.slice(0,10))}</div>
  </div>${fold('st-more', 'Campaign links, devices and countries', '', `<div class="grid cols3">
    <div class="card"><h3>Campaign links (UTM)</h3>${t.utm.length ? `<div class="list">${t.utm.map(u => `<div class="row"><span class="ell">${esc([u.source,u.medium,u.campaign].filter(Boolean).join(' / '))}</span><span class="grow"></span><span class="num">${u.views} views</span></div>`).join('')}</div>` : '<div class="muted">No tagged links seen yet. Add ?utm_source=NAME&amp;utm_campaign=NAME to any link you post and it shows up here and on each signup.</div>'}</div>
    <div class="card"><h3>Devices</h3>${hbars(t.devices.map(d => ({label:d.name, v:d.visitors})))}</div>
    <div class="card"><h3>Countries</h3>${hbars(t.countries.map(c => ({label:c.name, v:c.visitors})))}</div></div>`)}
  <div class="note" style="margin-top:12px">Updated ${esc(ago(t.generated))} · PostHog, cached 5 min</div>`;
  const by = Object.fromEntries(t.daily.map(d => [d.day, d])), span = [];   // a full 30-day axis, zero days included
  for (let i = 29; i >= 0; i--) span.push(new Date(Date.now() - i*86400000).toISOString().slice(0,10));
  groupBars($('#tr-days', el), span.map(day => ({label: day.slice(5).replace('-','/'), title: dayLabel(day), parts: {vis:(by[day]||{}).visitors||0, views:(by[day]||{}).views||0}})), [{k:'vis',label:'Visitors',color:'var(--c-cory)'},{k:'views',label:'Pageviews',color:'var(--c-gc)'}], {h:170});
};

boot();
</script>
</body>
</html>
