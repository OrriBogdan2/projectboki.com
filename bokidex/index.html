<script>/* theme: saved choice, else whatever the host set, else the OS setting. Set before first paint. */
(function(){var h=document.documentElement,t=null;try{t=localStorage.getItem("bokidex-theme")}catch(e){}
if(t!=="light"&&t!=="dark")t=null;
var c=h.getAttribute("data-theme");
if(t)h.setAttribute("data-theme",t);
else if(c!=="light"&&c!=="dark"){try{h.setAttribute("data-theme",matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){h.setAttribute("data-theme","light")}}})();</script>
<style>
/* Bokidex: one page, two audiences. #dex is the public creature dex (grid + entry + viewer); #edit and #audit are the owner's Rating Room and audit trail. */
:root{
  color-scheme:light;
  --bg:#f7f3ec; --panel:#ffffff; --soft:#f3eee4; --ink:#1d2230; --mute:#6a6e7c; --line:#e7dfd0; --tan:#a77d44;
  --moss:#3f7a4a; --moss-soft:#e3efe2; --good:#2f8a4c; --bad:#c2473a; --bad-soft:#f8e3df; --warn:#b07a12; --warn-soft:#f6ecd5;
  --accent:#4c5fd5; --accent-soft:#e4e7fb; --hero-bg:#efe9dc; --sil:#cfc6b4; --sil-bg:#efe9dc; --shadow:rgba(60,40,10,.18);
  --hbase:linear-gradient(180deg,#fbf8f2,#ece5d6); --hglow:20%; --hshadow:drop-shadow(0 12px 16px rgba(60,40,10,.30));
  --scrim:rgba(247,243,236,.62); --cardsh:0 1px 2px rgba(60,40,10,.05),0 14px 32px -20px rgba(60,40,10,.32);
  --ty-normal:#7d8594; --ty-fire:#e8552b; --ty-water:#2f7fe0; --ty-grass:#3fa050; --ty-spore:#a8689c; --ty-electric:#d9a50c; --ty-ice:#3fb5cf; --ty-rock:#8d7a55; --ty-psychic:#d6479a; --ty-flying:#6f8ee0; --ty-dragon:#5a4fd0; --ty-dark:#5a4a6e; --ty-poison:#9b45c4; --ty-bug:#82a014; --ty-steel:#6a8396; --ty-fairy:#e585b8; --ty-crystal:#25a89a; --ty-sound:#e0646f; --ty-wild:#7d8594;
  /* hero glow colours: the projectboki.com Boki wall TYPE map (assets/site.js), keyed by Bokidex type */
  --g-fire:#ff8a4c; --g-electric:#ffd84a; --g-ice:#9fe3ff; --g-dark:#a78bff; --g-crystal:#ff9df0; --g-poison:#a6ff3a; --g-water:#4fc3ff; --g-grass:#7dde6b; --g-sound:#ffb36b; --g-spore:#9ef0c0; --g-rock:#d2bf9f; --g-fairy:#d8d0ff; --g-bug:#ffcf5a; --g-steel:#e0a870; --g-dragon:#8fe8c8; --g-flying:#a8d4ff; --g-psychic:#b796ff; --g-normal:#f4e2c4;
  --display:"Lilita One","Baloo 2",ui-rounded,system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}

  color-scheme:dark;
  --bg:#0a1020; --panel:#111a30; --soft:#0c1427; --ink:#eaeefb; --mute:#8f9bb8; --line:#202b47; --tan:#d1ad7a;
  --moss:#7cc489; --moss-soft:#22362a; --good:#6ad08a; --bad:#ef7f72; --bad-soft:#3a2320; --warn:#e3b04f; --warn-soft:#3a2f17;
  --accent:#8e9cff; --accent-soft:#242b4d; --hero-bg:#0c1427; --sil:#26314f; --sil-bg:#0c1427; --shadow:rgba(0,0,0,.55);
  --hbase:linear-gradient(180deg,#121a2d,#0b111f); --hglow:30%; --hshadow:drop-shadow(0 16px 22px rgba(0,0,0,.55));
  --scrim:rgba(4,7,16,.66); --cardsh:0 16px 36px -24px rgba(0,0,0,.8);
  --ty-normal:#a9b0bd; --ty-fire:#ff8456; --ty-water:#5ca3ff; --ty-grass:#6cd07c; --ty-spore:#d08ec3; --ty-electric:#ffd84a; --ty-ice:#86e0f2; --ty-rock:#c0ad85; --ty-psychic:#ff7fc4; --ty-flying:#9db4ff; --ty-dragon:#8d83ff; --ty-dark:#9a86b8; --ty-poison:#c779f2; --ty-bug:#b4d23a; --ty-steel:#a5bccb; --ty-fairy:#ffa8d3; --ty-crystal:#55e0cf; --ty-sound:#ff8d96; --ty-wild:#a9b0bd}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a1020; --panel:#111a30; --soft:#0c1427; --ink:#eaeefb; --mute:#8f9bb8; --line:#202b47; --tan:#d1ad7a;
  --moss:#7cc489; --moss-soft:#22362a; --good:#6ad08a; --bad:#ef7f72; --bad-soft:#3a2320; --warn:#e3b04f; --warn-soft:#3a2f17;
  --accent:#8e9cff; --accent-soft:#242b4d; --hero-bg:#0c1427; --sil:#26314f; --sil-bg:#0c1427; --shadow:rgba(0,0,0,.55);
  --hbase:linear-gradient(180deg,#121a2d,#0b111f); --hglow:30%; --hshadow:drop-shadow(0 16px 22px rgba(0,0,0,.55));
  --scrim:rgba(4,7,16,.66); --cardsh:0 16px 36px -24px rgba(0,0,0,.8);
  --ty-normal:#a9b0bd; --ty-fire:#ff8456; --ty-water:#5ca3ff; --ty-grass:#6cd07c; --ty-spore:#d08ec3; --ty-electric:#ffd84a; --ty-ice:#86e0f2; --ty-rock:#c0ad85; --ty-psychic:#ff7fc4; --ty-flying:#9db4ff; --ty-dragon:#8d83ff; --ty-dark:#9a86b8; --ty-poison:#c779f2; --ty-bug:#b4d23a; --ty-steel:#a5bccb; --ty-fairy:#ffa8d3; --ty-crystal:#55e0cf; --ty-sound:#ff8d96; --ty-wild:#a9b0bd}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
[hidden]{display:none!important}
a{color:var(--accent)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);border-bottom:1px solid var(--line);padding-block:14px 12px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
body.v-dex header{position:static}
h1{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;margin:0;text-wrap:balance;letter-spacing:.01em}
.sub{color:var(--mute);font-size:.84rem}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{font:700 .85rem var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.nav a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.nav kbd,.hint kbd{font:600 .68rem var(--mono);border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.dcard:focus-visible,.card:focus-visible,.arow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ---------- Bokidex ---------- */
html{font-synthesis:none;-webkit-text-size-adjust:100%}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.themebtn{width:42px;padding:0;justify-content:center;border-radius:50%;flex:none}
.themebtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.themebtn .sun{display:none}
html[data-theme="dark"] .themebtn .sun{display:block}
html[data-theme="dark"] .themebtn .moon{display:none}
body.v-dex header .themebtn{display:none}
.dbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);padding:12px 0 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.drow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.search{position:relative;flex:1 1 220px;min-width:0;display:block}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:18px;height:18px;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round;pointer-events:none}
.dbar input,.dbar select{font:500 .92rem var(--body);height:42px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);padding:0 16px;min-width:0}
.dbar input{width:100%;padding-left:40px}
.dbar select{flex:0 1 auto;padding-right:10px}
.abar select{font:600 .92rem var(--body);height:40px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0 12px;min-width:0}
.btn{font:600 .9rem var(--body);height:42px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.trow{justify-content:space-between;flex-wrap:nowrap;align-items:flex-start}
.tf{display:flex;gap:6px;flex-wrap:wrap;min-width:0;flex:1 1 auto}
.tbtn{--ty:var(--ty-wild);font:600 .76rem var(--body);height:30px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--mute);padding:0 11px 0 9px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:background .15s,border-color .15s,color .15s;flex:none}
.tbtn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ty)}
.tbtn:hover{color:var(--ink);border-color:color-mix(in srgb,var(--ty) 55%,var(--line))}
.tbtn[aria-pressed="true"]{background:color-mix(in srgb,var(--ty) 20%,var(--panel));border-color:var(--ty);color:var(--ink)}
.tbtn small{font:600 .66rem var(--mono);opacity:.6}
.tmeta{display:flex;gap:10px;align-items:center;flex:none;height:30px;white-space:nowrap}
.tlink{font:600 .76rem var(--body);background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 2px}
.dcount{color:var(--mute);font:600 .76rem var(--mono)}
.hint{display:none;color:var(--mute);font-size:.8rem;margin:12px 0 0}
@media (hover:hover) and (pointer:fine){.hint{display:block}}
#dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;margin-top:18px}
.dcard{--ty:var(--ty-wild);position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none;color:var(--ink);background:var(--panel);border-radius:24px;padding:10px 10px 18px;border:1px solid var(--line);box-shadow:var(--cardsh);scroll-margin-top:150px;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.dcard.on{border-color:var(--ty);box-shadow:0 0 0 2px var(--ty)}
.dcard.dim{--ty:var(--mute)}
.dcard .hero{width:100%}
.hero{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--g,var(--g-wild)) var(--hglow),transparent),transparent 62%),var(--hbase)}
.hero.opq{background:var(--hb)}
.hero img,.hero .himg{width:100%;height:100%;display:block}
.hero img{object-fit:contain}
.hero.cut img{filter:var(--hshadow)}
.himg{background-repeat:no-repeat}
.hero.sil{background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--g,var(--g-wild)) calc(var(--hglow) * .5),transparent),transparent 62%),var(--hbase)}
.hero.sil svg{width:60%;height:60%;position:absolute;inset:20%;fill:var(--sil)}
.dn{position:absolute;top:22px;left:24px;font:700 .72rem var(--mono);color:var(--mute);letter-spacing:.06em;z-index:1}
.dnm{font:400 1.35rem/1.1 var(--display);margin:10px 6px 0;overflow-wrap:anywhere;letter-spacing:.005em}
.tlines{display:flex;justify-content:center;flex-wrap:wrap;margin-top:6px;min-height:1.1em}
.tl{font:600 .68rem var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);display:inline-flex;align-items:center;gap:5px}
.tl i{width:6px;height:6px;border-radius:50%;background:var(--ty);display:inline-block}
.tl+.tl::before{content:"\00b7";margin:0 .55em 0 .45em}
.dcard.unk .dnm{color:var(--mute)}
.dcard .fbadge{position:absolute;top:20px;right:22px;font:700 .6rem var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--bg);border-radius:999px;padding:2px 8px;z-index:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{--ty:var(--ty-wild);font:700 .72rem var(--body);letter-spacing:.09em;text-transform:uppercase;border-radius:999px;padding:5px 13px 5px 10px;border:1px solid color-mix(in srgb,var(--ty) 55%,transparent);background:color-mix(in srgb,var(--ty) 16%,var(--panel));color:var(--ink);display:inline-flex;align-items:center;gap:7px}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ty)}
/* modal */
html.modal-open body{overflow:hidden}
#detail{position:fixed;inset:0;z-index:40;display:none;--ty:var(--ty-wild)}
#detail.open{display:flex;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top,0px)) 0 max(18px,env(safe-area-inset-bottom,0px))}
.mback{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.1)}
.mwrap{position:relative;width:min(1120px,100%);padding:0 30px;max-height:100%}
.msheet{position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);background:var(--panel);border:1px solid var(--line);border-radius:30px;overflow:hidden;height:min(90vh,880px);box-shadow:0 40px 110px -30px rgba(0,0,0,.55)}
.mart{position:relative;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:30px;min-width:0;background:var(--soft)}
.mart .herobtn{max-width:min(100%,calc(90vh - 140px),760px);width:100%;margin:0 auto}
.mart .hero.sil svg{fill:color-mix(in srgb,var(--ty) 26%,var(--sil))}
.minfo{overflow:auto;padding:40px 42px 28px;min-width:0;overscroll-behavior:contain}
.mfit{transform-origin:0 0}
.mclose{position:absolute;top:16px;right:16px;z-index:3;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}

.mnav svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.mnav:hover{transform:scale(1.08)}
.mnav.pv{left:2px}.mnav.nx{right:2px}
.mkick{font:700 .74rem var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--tan);padding-right:48px}
.mhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:6px 0 0}
.mhead .mtypes{margin:0}
.mh{font:400 clamp(1.9rem,3.4vw,2.6rem)/1 var(--display);margin:0;overflow-wrap:anywhere;letter-spacing:.005em}
.mcat{color:var(--mute);font-size:.92rem;margin:12px 0 0}
.appr{display:inline-block;font:700 .7rem var(--mono);color:var(--good);background:var(--moss-soft);border-radius:999px;padding:2px 10px;margin:10px 0 0}
.dtabs{display:flex;gap:6px;margin:16px 0 4px}
.dtabs a{font:600 .8rem var(--body);text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 14px}
.dtabs a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mtabs{display:flex;gap:2px;margin:18px 0 4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.mtabs button{font:600 .92rem var(--body);background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:10px 13px;cursor:pointer;margin-bottom:-1px;white-space:nowrap}
.mtabs button:hover{color:var(--ink)}

.blurb{font-size:1.2rem;line-height:1.55;margin:20px 0 4px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-flow:row dense;gap:8px;margin:12px 0}
.facts>div{background:var(--soft);border-radius:14px;padding:8px 12px;min-width:0}
.facts .wide{grid-column:1/-1}

.facts dd{margin:0;font-weight:600;font-size:.9rem;overflow-wrap:anywhere}
.facts dd small{display:block;font-weight:500;font-size:.74rem;color:var(--mute)}
.facts dd a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.facts dd a:hover{border-color:var(--ty)}
.facts dd .sep{color:var(--mute);margin:0 .35em}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px}
.sgrid>div{min-width:0}
.stat{display:grid;grid-template-columns:76px 1fr auto;gap:8px;align-items:center;font-size:.82rem;margin:4px 0}
.stat i{display:block;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.stat i b{display:block;height:100%;background:var(--ty);border-radius:99px}
.stat span:last-child{font:700 .78rem var(--mono);text-align:right;white-space:nowrap}
.lbl{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700}
.herobtn{display:block;width:100%;padding:0;border:0;background:none;color:inherit;border-radius:24px;cursor:pointer;position:relative}
.herobtn[disabled]{cursor:default}
.herobtn .hero{border-radius:24px}
.herobtn .go{position:absolute;right:10px;bottom:10px;background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;font:600 .75rem var(--body);padding:5px 12px}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (max-width:759px){
  #dgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .dcard{border-radius:20px;padding:8px 8px 14px}
  .dnm{font-size:1.12rem}
  .dn{top:16px;left:18px}.dcard .fbadge{top:15px;right:16px}
  .hint{display:none!important}
  #detail.open{padding:0;align-items:stretch}
  .mwrap{width:100%;padding:0;height:100%}
  .msheet{display:flex;flex-direction:column;border-radius:0;border:0;height:100%;overflow:hidden}
  .mart{flex:none;padding:max(14px,env(safe-area-inset-top,0px)) 64px 10px;gap:8px}
  .mart .herobtn{max-width:min(52vw,19vh)}
  .herobtn .go{font-size:.66rem;padding:3px 9px;right:4px;bottom:4px}
  .ftog .hero{width:30px}
  .minfo{flex:1 1 auto;min-height:0;overflow:auto;padding:10px 16px calc(58px + env(safe-area-inset-bottom,0px))}
  .ab2,.sgrid{grid-template-columns:minmax(0,1fr)}
  .mlist{gap:5px 10px}.mlist>div{font-size:.72rem}.affs>div{font-size:.76rem}
  .panel{padding:10px 11px}.ec2{width:62px}.evo2 ul.many .ec2{width:52px}
  .mkick{padding-right:0}
  .mclose{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:16px}
  .mnav{position:fixed;top:auto;bottom:max(8px,env(safe-area-inset-bottom,0px));translate:none;width:44px;height:44px}
  .mnav.pv{left:16px}.mnav.nx{right:16px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts>div[style]{grid-column:1/-1!important}
  .mh{font-size:1.8rem}
}
body.v-dex header{position:static}
/* detail view: sections are stacked panels, each hidden when it has no data */
.ftog{display:flex;gap:8px;margin:12px 0 0}
.ftog a{--ty:var(--ty-wild);flex:1 1 0;min-width:0;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font:800 .9rem var(--display);line-height:1.1}
.ftog a[aria-current="true"]{border-color:var(--ty);box-shadow:0 0 0 2px var(--ty)}
.ftog .hero{width:38px;flex:none;border-radius:50%}
.ftog span{overflow-wrap:anywhere}
.panel{background:var(--bg);border-radius:16px;padding:12px 14px;margin:10px 0}
.panel>.lbl:first-child{display:block;margin-bottom:8px}
.panel p{margin:6px 0;font-size:.95rem;line-height:1.5}
.mut{color:var(--mute);font-size:.8rem}
.quote{border-left:3px solid var(--ty);padding:1px 0 1px 10px;margin:6px 0;font-size:.88rem;color:var(--mute)}
.ab2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ab2>div{background:var(--panel);border-radius:12px;padding:9px 11px;min-width:0}
.ab2 b{font:800 1rem var(--display)}
.ab2 p{margin:3px 0 0;font-size:.9rem;line-height:1.45}
.ab2 .one{grid-column:1/-1}
.tag{display:inline-block;font:700 .62rem var(--mono);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:1px 8px;margin-right:6px;background:var(--accent-soft);color:var(--accent);vertical-align:2px}
.tag.alt{background:var(--moss-soft);color:var(--moss)}
.evo2,.evo2 ul{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:6px}
.evo2{overflow-x:auto;padding:6px 2px 10px}.evo2>li{margin-inline:auto}
.evo2 ul{flex-direction:column;align-items:flex-start}
.evo2 ul.many{display:grid;grid-template-columns:repeat(2,auto);gap:4px 6px}
.evo2 ul.many .ec2{width:60px}
.evo2 li{display:flex;align-items:center;gap:6px}
.lk{display:flex;flex-direction:column;align-items:center;min-width:24px;max-width:60px;color:var(--mute);text-align:center}
.lk b{font-size:1.2rem;line-height:1}
.lk small{font:700 .56rem var(--mono);line-height:1.1;overflow-wrap:anywhere}
.ec2{--ty:var(--ty-wild);display:block;width:76px;flex:none;text-decoration:none;color:var(--ink);text-align:center}
.ec2 .hero{border-radius:50%;border:2px solid color-mix(in srgb,var(--ty) 45%,var(--line));background:var(--bg)}
.ec2.on .hero{border-color:var(--ty);box-shadow:0 0 0 3px var(--ty)}
.ec2 small{display:block;font:700 .6rem var(--mono);color:var(--mute);margin-top:3px}
.ec2 b{display:block;font:800 .78rem var(--display);line-height:1.1;overflow-wrap:anywhere}
.ec2 em{display:inline-block;font:800 .58rem var(--mono);font-style:normal;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 7px;margin-top:3px}
.affs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.affs>div{background:var(--panel);border-radius:12px;padding:8px 11px;font-size:.82rem;min-width:0}
.affs p{margin:3px 0 0}
.affs b{font:800 .95rem var(--display)}
.sw{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:6px 0}
.sw div{display:flex;gap:4px;align-items:center;font-size:.78rem;color:var(--mute)}
.sw i{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);display:inline-block}
.mlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin:8px 0}
.mlist>div{display:grid;grid-template-columns:12px minmax(0,1fr);gap:2px 7px;font-size:.78rem;line-height:1.35}
.mlist .dot{width:12px;height:12px;border-radius:50%;margin-top:5px;box-shadow:0 0 0 1px var(--line)}
.mlist b{font:800 .88rem var(--display)}
.mlist .mut{display:block}
details.dd summary{cursor:pointer;font:700 .85rem var(--body);color:var(--accent);margin:6px 0}
details.dd ul{margin:6px 0 0;padding-left:18px;font-size:.84rem}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.gal figure{margin:0}
.gal img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--panel);border-radius:10px;cursor:zoom-in;display:block}
.gal figcaption{font:700 .62rem var(--mono);color:var(--mute);text-align:center;margin-top:2px}
.alts.gal{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.alts.gal figure{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 6px 8px}
.alts.gal img{border-radius:8px;background:var(--soft)}
.alts.gal figcaption{font:600 .8rem var(--body);color:var(--ink);margin-top:6px}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--ty)}
/* viewer */
#viewer{position:fixed;inset:0;z-index:50;background:rgba(6,8,14,.9);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.vbox{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:min(1000px,100%);height:min(780px,100%);display:flex;flex-direction:column;overflow:hidden}
.vhead{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vhead .t{font:800 1.1rem var(--display);margin-right:auto;overflow-wrap:anywhere}
.vtabs{display:flex;gap:6px}
.vtabs button{font:700 .85rem var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.vtabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
#vbody{flex:1;min-height:0;position:relative;background:var(--hero-bg)}
#vbody model-viewer{width:100%;height:100%;--poster-color:transparent;background:transparent}
.vmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);text-align:center;padding:20px}
.tz{position:absolute;inset:0;overflow:auto;display:grid;place-items:center;cursor:zoom-in}
.tz img{width:100%;height:100%;object-fit:contain;display:block}
.tz.z2{place-items:start;cursor:grab}.tz.z2 img{width:220%;height:auto;max-width:none}
.tz.z3{place-items:start;cursor:grab}.tz.z3 img{width:340%;height:auto;max-width:none}
.vfoot:empty{display:none}
.vfoot{padding:8px 12px;border-top:1px solid var(--line);color:var(--mute);font-size:.8rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* ---------- owner areas: Rating Room feed, History, Audit ---------- */
.bar{font-family:var(--mono);font-size:.8rem;background:var(--moss-soft);color:var(--moss);border-radius:999px;padding:3px 10px;font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tabs button{font:600 .85rem var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:var(--panel)}
.tabs button:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.how{color:var(--mute);font-size:.88rem;max-width:68ch;margin:14px 0 6px}
#v-edit,#v-audit,#v-lock{max-width:980px;margin:0 auto}
#feed{display:grid;gap:18px;margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);scroll-margin-top:90px}
@media (max-width:760px){.card{grid-template-columns:minmax(0,1fr)}}
.pics{background:var(--bg);display:grid;gap:4px;padding:6px;align-content:start}
.pics .main{width:100%;aspect-ratio:1;object-fit:contain;background:var(--panel);border-radius:8px;cursor:zoom-in}
.thumbs{display:flex;gap:4px;flex-wrap:wrap}
.thumbs img{width:56px;height:56px;object-fit:contain;background:var(--panel);border-radius:6px;border:2px solid transparent;cursor:pointer}
.thumbs img.on{border-color:var(--moss)}
.thumbs .sheet{border-color:var(--line)}
.info{padding:16px 18px;display:grid;gap:12px;align-content:start;min-width:0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1.1}
.meta{color:var(--mute);font-size:.8rem;font-family:var(--mono)}
.dl{font:700 .8rem var(--body);color:var(--accent)}
.pill{font:700 .75rem var(--body);letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap}
.p-wait{background:var(--warn-soft);color:var(--warn)} .p-ok{background:var(--moss-soft);color:var(--good)} .p-redo{background:var(--bad-soft);color:var(--bad)}
.auto{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.score{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.big{font-size:1.6rem;line-height:1}
.lo{color:var(--bad)} .hi{color:var(--good)}
.auto p{margin:0;font-size:.9rem}
.auto ul{margin:0;padding-left:18px;font-size:.86rem;color:var(--mute)}
.rate{display:grid;gap:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=range]{flex:1;min-width:140px;accent-color:var(--moss)}
input[type=number]{width:5.2em;font:700 1.1rem var(--mono);padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{width:100%;min-height:56px;font:inherit;font-size:.9rem;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.save{font:700 .9rem var(--body);border:0;border-radius:9px;padding:8px 16px;background:var(--moss);color:var(--panel);cursor:pointer}
.save:disabled{opacity:.5;cursor:default}
.verdict{font-size:.85rem;color:var(--mute)}
.verdict b{color:var(--ink)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:28px;color:var(--mute);text-align:center}
.arow{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;margin:10px 0;scroll-margin-top:90px}
.arow.win{border-left-color:var(--good)}
.arow.rej{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--panel))}
.arow.pend{border-left-color:var(--warn)}
.ah{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ah b{font:800 1.05rem var(--display)}
.badge{font:700 .68rem var(--body);letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 9px}
.b-win{background:var(--good);color:var(--bg)}
.b-rej{background:var(--bad);color:var(--bg)}
.ab{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.zset{display:flex;gap:4px;flex-wrap:wrap;max-width:200px}
.zset img{width:60px;height:60px;object-fit:contain;background:var(--bg);border-radius:8px;cursor:zoom-in}
.ad{font-size:.86rem;display:grid;gap:4px;min-width:0}
.ad p{margin:0}
.ad ul{margin:0;padding-left:18px;color:var(--mute)}
@media (max-width:560px){.ab{grid-template-columns:minmax(0,1fr)}.zset{max-width:none}}
.abar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.cnt{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.cnt div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:96px}
.cnt b{display:block;font:800 1.5rem/1 var(--display)}
#zoom{position:fixed;inset:0;z-index:60;background:rgba(10,14,11,.88);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%;object-fit:contain}
@media (prefers-reduced-motion:no-preference){.card{animation:in .35s ease-out both}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
/* ---------- Interactive feel: lift, type-colour glow, press feedback (borrowed from the projectboki.com Boki wall) ---------- */
.dcard,.btn,.tbtn,.mnav,.mclose,.dtabs a,.nav a,.mtabs button,.tlink,.dbar select{--ease:cubic-bezier(.2,.8,.2,1)}
.dcard{transition:transform .5s var(--ease),box-shadow .5s ease,border-color .3s ease}
.dcard .hero img,.dcard .hero .himg,.dcard .hero.sil svg{transition:transform .6s var(--ease)}
.btn{transition:transform .25s var(--ease),box-shadow .3s ease,background .15s,border-color .2s}
.tbtn{transition:transform .25s var(--ease),box-shadow .3s ease,background .15s,border-color .2s,color .15s}
.mnav{transition:transform .25s var(--ease),box-shadow .3s ease,background .15s}
.mclose,.dtabs a,.nav a,.dbar select{transition:transform .25s var(--ease),box-shadow .3s ease,border-color .2s,background .15s}
.mtabs button{transition:color .15s,border-color .2s,background .15s,transform .25s var(--ease)}
.dbar select{cursor:pointer}
@media (hover:hover){
  .dcard:hover{border-color:color-mix(in srgb,var(--g,var(--ty)) 55%,transparent);box-shadow:0 26px 60px -24px color-mix(in srgb,var(--g,var(--ty)) 55%,transparent)}
  .chip{transition:box-shadow .3s ease,border-color .2s}
  .chip:hover{box-shadow:0 8px 20px -8px color-mix(in srgb,var(--ty) 75%,transparent);border-color:var(--ty)}
  .tbtn:hover{box-shadow:0 8px 22px -8px color-mix(in srgb,var(--ty) 80%,transparent)}
  .btn:hover,.dbar select:hover,.mclose:hover,.dtabs a:hover,.nav a:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 8px 22px -10px color-mix(in srgb,var(--accent) 65%,transparent)}
  .btn.pri:hover{box-shadow:0 10px 26px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
  .mnav:hover{box-shadow:0 12px 30px -8px color-mix(in srgb,var(--ty) 70%,transparent)}
  .mtabs button:hover{background:color-mix(in srgb,var(--ty) 10%,transparent);border-bottom-color:color-mix(in srgb,var(--ty) 45%,transparent)}
  .mtabs button[aria-selected="true"]:hover{border-bottom-color:var(--ty)}
}
/* focus: same family as hover, always visible for keyboard */
.dcard:focus-visible{outline:3px solid var(--g,var(--ty));outline-offset:3px;box-shadow:0 26px 60px -24px color-mix(in srgb,var(--g,var(--ty)) 55%,transparent)}
.tbtn:focus-visible,.chip:focus-visible{outline:2px solid var(--ty);outline-offset:2px;box-shadow:0 0 0 4px color-mix(in srgb,var(--ty) 25%,transparent)}
.btn:focus-visible,.mnav:focus-visible,.mclose:focus-visible,.dtabs a:focus-visible,.nav a:focus-visible,.dbar select:focus-visible,.mtabs button:focus-visible,.dbar input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}
.mtabs button:focus-visible{outline-offset:-2px}
/* motion only when the user allows it */
@media (prefers-reduced-motion:no-preference){
  @media (hover:hover){
    .dcard:hover{transform:translateY(-6px)}
    .dcard:hover .hero img,.dcard:hover .hero .himg,.dcard:hover .hero.sil svg{transform:scale(1.06) rotate(-2deg)}
    .btn:hover,.tbtn:hover,.dtabs a:hover,.nav a:hover,.dbar select:hover{transform:translateY(-2px)}
    .mclose:hover{transform:scale(1.08)}
    .mnav:hover{transform:scale(1.1)}
  }
  .dcard:active{transform:translateY(-2px) scale(.98);transition-duration:.12s}
  .btn:active,.tbtn:active,.dtabs a:active,.nav a:active,.dbar select:active,.mclose:active,.mtabs button:active{transform:scale(.97);transition-duration:.08s}
  .mnav:active{transform:scale(.97)}
  .chip:active{transform:scale(.97)}
}
@media (prefers-reduced-motion:reduce){
  .dcard,.dcard .hero img,.dcard .hero .himg,.btn,.tbtn,.mnav,.mclose,.dtabs a,.nav a,.mtabs button,.dbar select{transition-property:color,background,border-color,box-shadow!important}
  .dcard:hover,.mnav:hover,.btn:hover,.tbtn:hover{transform:none}
}
/* owner 11-09: dex console header. Redesigned 11-09: instrument look, hairlines + ticks + mono readout, one slow sweep. */
header{border-bottom:0;padding-block:12px 0;gap:10px 18px}
header::after{content:"";flex:1 1 100%;order:9;height:8px;--tk:color-mix(in srgb,var(--ink) 20%,transparent);
  background:repeating-linear-gradient(90deg,var(--tk) 0 1px,transparent 1px 48px) left top/100% 8px no-repeat,repeating-linear-gradient(90deg,var(--tk) 0 1px,transparent 1px 8px) left top/100% 4px no-repeat,linear-gradient(var(--line),var(--line)) left top/100% 1px no-repeat}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand h1{font-size:1.75rem;letter-spacing:.015em}
.brand>div{display:grid;gap:3px;min-width:0}
.rd{display:flex;align-items:center;gap:8px;font:500 .64rem var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);white-space:nowrap;line-height:1}
.rd i{width:1px;height:9px;background:var(--line);display:inline-block}
.rd b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.lens{--s:46px;width:var(--s);height:var(--s);flex:none;position:relative;display:block;color:var(--accent)}
.lens svg{width:100%;height:100%;overflow:visible;display:block}
.lens .sw{transform-origin:32px 32px;transform:rotate(40deg)}
@media (prefers-reduced-motion:no-preference){.lens .sw{animation:sweep 7s linear infinite}}
@keyframes sweep{to{transform:rotate(400deg)}}
.dbar{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:color-mix(in srgb,var(--panel) 90%,transparent);box-shadow:0 10px 30px -26px var(--shadow)}
.dbar .drow{flex-wrap:nowrap;gap:8px}
.dbar .search{flex:1 1 auto}
.dbar input{height:40px;border-radius:8px;background:transparent;border:1px solid var(--line);font-size:.92rem;padding-left:38px;padding-right:96px}
.dbar input::placeholder{color:var(--mute)}
.dbar input:focus{border-color:var(--accent);background:var(--panel);outline:0}
.search svg{left:13px;width:16px;height:16px;stroke-width:1.8}
.dcount{position:absolute;right:12px;top:50%;translate:0 -50%;font:500 .68rem var(--mono);letter-spacing:.1em;color:var(--mute);pointer-events:none;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:0;padding:3px;height:40px;border-radius:8px;border:1px solid var(--line);flex:none}
.seg button{font:600 .7rem var(--mono);letter-spacing:.12em;text-transform:uppercase;border:0;background:none;color:var(--mute);border-radius:5px;padding:0 12px;cursor:pointer;transition:background .15s,color .15s,box-shadow .2s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.seg .sdir{padding:0 9px;display:grid;place-items:center}
.seg .sdir svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.seg .sdir.rev svg{transform:scaleY(-1)}
.seg .sdir:disabled{opacity:.3;cursor:default}
.ibtn{width:40px;height:40px;flex:none;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:background .15s,border-color .2s,color .15s}
.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ibtn .pip{fill:currentColor;stroke:none}
.ibtn:hover,.dbar .themebtn:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));color:var(--accent);box-shadow:none;transform:none}
.ibtn:active{transform:scale(.96)}
.ibtn[aria-pressed="true"]{background:var(--soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.ibtn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#surprise .qm{font:700 1rem/1 var(--mono);color:var(--accent);display:block}
.dbar .themebtn{border-radius:8px;width:40px;height:40px;background:transparent;color:var(--ink);border:1px solid var(--line)}
.dbar .themebtn svg{width:18px;height:18px;stroke-width:1.7}
.dbar .hint{margin:10px 2px 0}
.dbar .hint[hidden]{display:none}
.tmeta{display:flex;align-items:center;gap:12px;height:auto;margin:14px 2px 8px}
.tmeta::after{content:"";order:1;flex:1 1 auto;height:1px;background:var(--line)}
.tlbl{order:0;flex:none;font:500 .62rem var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.tacts{order:2;display:flex;gap:12px}
.tlink{font:600 .7rem var(--mono);letter-spacing:.06em}
.tf{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}

<script>
/* Swipe left / right on an open entry to go to the next / previous Boki (and between pictures when one is zoomed).
   Added from the projectboki.com site repo: keep this block in exports. Horizontal scrollers, the 3D viewer and form
   fields keep their own swipes. */
(function(){
  let x0=0,y0=0,t0=0,ok=false;
  const scroller=el=>{for(let n=el;n&&n!==document.body;n=n.parentElement){if(n.scrollWidth>n.clientWidth+4){const o=getComputedStyle(n).overflowX;if(o==="auto"||o==="scroll")return true}}return false};
  addEventListener("touchstart",e=>{
    if(e.touches.length!==1){ok=false;return}
    const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();
    const zoom=!$("#zoom").hidden, el=e.target;
    ok=zoom||(view==="dex"&&!!sel&&!viewerOpen()&&!!el.closest("#detail")&&!scroller(el)&&!el.closest("input,textarea,select,canvas,model-viewer,[data-noswipe]"));
  },{passive:true});
  addEventListener("touchend",e=>{
    if(!ok)return; ok=false;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Date.now()-t0>800||Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.6)return;
    const d=dx<0?1:-1;
    if(!$("#zoom").hidden){if(zoomList.length>1){zoomI=(zoomI+d+zoomList.length)%zoomList.length;$("#zoom-img").src=zoomList[zoomI]}return}
    const det=$("#detail"), was=sel;
    moveSel(d);
    if(sel===was||!det||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
    det.animate([{transform:`translateX(${d*42}px)`,opacity:.35},{transform:"none",opacity:1}],{duration:260,easing:"cubic-bezier(.2,.8,.2,1)"});
  },{passive:true});
})();
</script>
